name: DPRO CAR STEP CAR-23 Data Migration CSV

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/step-car-23-data-migration-csv.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-car-step-car-23
  cancel-in-progress: false

jobs:
  update-data-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify CAR-23 Worker and SQL
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          url="https://dpro-used-car-line-api.dpromstk2000.workers.dev/api/health"
          request=urllib.request.Request(
              url,
              headers={
                  "Accept":"application/json",
                  "User-Agent":"Mozilla/5.0",
                  "Origin":"https://dpromstk2000-lab.github.io",
              },
          )
          try:
              with urllib.request.urlopen(request,timeout=25) as response:
                  data=json.load(response)
          except urllib.error.HTTPError as error:
              if error.code==403:
                  print("::warning::GitHub ActionsからWorkerへの確認だけがHTTP 403でした。ブラウザ確認を前提に続行します。")
                  raise SystemExit(0)
              raise
          if data.get("version")!="CAR-23-WORKER-CSV-PREVIEW-COMMIT-EXPORT-COMPLETE-20260724":
              raise SystemExit(f"WorkerがCAR-23ではありません: {data.get('version')}")
          checks=data.get("checks") or {}
          required=[
              "car23_data_migration_schema",
              "owner_data_migration_overview_ready",
              "owner_data_migration_preview_ready",
              "owner_data_migration_commit_ready",
              "data_migration_duplicate_guard_ready",
              "data_migration_csv_quote_parser_ready",
              "data_migration_csv_export_escape_ready",
              "data_migration_preview_before_commit_ready",
              "data_migration_automatic_commit_disabled",
              "admin_guard",
          ]
          failed=[key for key in required if checks.get(key) is not True]
          if failed:
              raise SystemExit(f"CAR-23 Worker/SQL確認失敗: {failed}")
          print("CAR-23 Worker/SQL: OK")
          PY

      - name: Apply CAR-23 frontend update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          OWNER=Path("owner.html")
          CONFIG=Path("config.js")
          SYSTEM=Path("system-check.html")

          for path in (OWNER,CONFIG,SYSTEM):
              if not path.exists():
                  raise SystemExit(f"{path.name} が見つかりません。")

          owner=OWNER.read_text(encoding="utf-8")
          config=CONFIG.read_text(encoding="utf-8")
          system=SYSTEM.read_text(encoding="utf-8")

          old="CAR-22-R2-PRINT-WINDOW-BLANK-FIX-20260724"
          new="CAR-23-DATA-MIGRATION-CSV-IMPORT-EXPORT-20260724"

          if old not in owner or old not in config:
              raise SystemExit("CAR-22-R2の現行フロントエンドを確認できません。")

          owner_css=json.loads('"\\n    /* DPRO CAR STEP CAR-23 DATA MIGRATION */\\n    .migration-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}\\n    .migration-kpi{padding:15px;border:1px solid var(--line);border-radius:15px;background:#fff}\\n    .migration-kpi span{display:block;color:var(--muted);font-size:13px;font-weight:850}.migration-kpi strong{display:block;font-size:27px}\\n    .migration-layout{margin-top:15px;display:grid;grid-template-columns:minmax(340px,.8fr) minmax(0,1.2fr);gap:15px}\\n    .migration-panel{padding:18px;border:1px solid var(--line);border-radius:17px;background:#fff}\\n    .migration-panel h3{margin:0;font-size:21px}.migration-panel>p{margin:3px 0 14px;color:var(--muted);font-size:13px}\\n    .migration-form{display:grid;gap:10px}.migration-field{display:grid;gap:5px}.migration-field label{font-size:13px;font-weight:900}\\n    .migration-field input,.migration-field select{width:100%;min-height:48px;padding:8px 10px;border:1px solid #b9c6d0;border-radius:10px;background:#fff}\\n    .migration-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.migration-actions .button{width:100%}\\n    .migration-safe{margin-top:13px;padding:14px;border-radius:12px;background:var(--navy);color:#fff}.migration-safe strong{display:block}.migration-safe span{display:block;color:#d2dfe8;font-size:13px}\\n    .migration-preview{display:grid;gap:9px}.migration-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}\\n    .migration-summary div{padding:10px;border-radius:10px;background:var(--soft)}.migration-summary span{display:block;color:var(--muted);font-size:11px}.migration-summary strong{display:block;font-size:20px}\\n    .migration-row{padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff}.migration-row.error{border-color:#d9a6a0;background:#fff4f2}.migration-row.duplicate{border-color:#e0b660;background:#fff9ea}\\n    .migration-row strong{display:block}.migration-row span{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}\\n    .migration-job-list{display:grid;gap:9px}.migration-job{padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}\\n    .migration-job-head{display:flex;justify-content:space-between;gap:10px}.migration-job h4{margin:0}.migration-job p{margin:3px 0 0;color:var(--muted);font-size:12px}\\n    .migration-export{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}\\n    @media(max-width:1050px){.migration-layout{grid-template-columns:1fr}}\\n    @media(max-width:700px){.migration-kpis,.migration-summary,.migration-actions,.migration-export{grid-template-columns:1fr}}\\n"')
          owner_js=json.loads('"\\n    const CAR23_TYPE_LABEL={customers:\\"顧客\\",customer_vehicles:\\"顧客車両\\",inventory:\\"販売在庫\\"};\\n    const CAR23_STATUS_LABEL={previewed:\\"事前検査済み\\",committing:\\"取込中\\",completed:\\"完了\\",failed:\\"失敗\\",cancelled:\\"中止\\"};\\n    let car23Data=null,car23Preview=null,car23FileText=\\"\\";\\n\\n    async function car23Load(){\\n      car23Data=await api(\\"/api/admin/data-migration\\");\\n      makeNav(document.getElementById(\\"desktopNav\\"));\\n      makeNav(document.getElementById(\\"mobileNav\\"));\\n      return car23Data;\\n    }\\n\\n    function car23Download(filename,text){\\n      const blob=new Blob([text],{type:\\"text/csv;charset=utf-8\\"});\\n      const url=URL.createObjectURL(blob),anchor=document.createElement(\\"a\\");\\n      anchor.href=url;anchor.download=filename;document.body.append(anchor);anchor.click();anchor.remove();\\n      setTimeout(()=>URL.revokeObjectURL(url),1000);\\n    }\\n\\n    function renderMigration(){\\n      const root=document.getElementById(\\"view-migration\\");clear(root);\\n      root.append(sectionHeader(\\"CSVデータ移行\\",\\"顧客・車両・在庫を事前検査してから安全に取り込みます\\",0));\\n      root.append(el(\\"div\\",\\"empty\\",\\"取込履歴を取得しています。\\"));\\n      car23Load().then(()=>car23Render(root)).catch(error=>{clear(root);root.append(empty(error.message));showToast(error.message,true)});\\n    }\\n\\n    function car23Render(root){\\n      clear(root);\\n      const jobs=car23Data?.jobs||[];\\n      root.append(sectionHeader(\\"CSVデータ移行\\",\\"自動登録せず、必ず事前検査結果を確認してから確定します\\",jobs.length));\\n      const kpis=el(\\"div\\",\\"migration-kpis\\");\\n      const total=jobs.length,completed=jobs.filter(x=>x.status===\\"completed\\").length,failed=jobs.filter(x=>x.status===\\"failed\\").length,rows=jobs.reduce((sum,x)=>sum+Number(x.inserted_rows||0)+Number(x.updated_rows||0),0);\\n      [[\\"取込履歴\\",total],[\\"完了\\",completed],[\\"取込・更新行\\",rows],[\\"失敗\\",failed]].forEach(([labelText,value])=>{const card=el(\\"article\\",\\"migration-kpi\\");card.append(el(\\"span\\",\\"\\",labelText),el(\\"strong\\",\\"\\",String(value)));kpis.append(card)});\\n      root.append(kpis);\\n\\n      const layout=el(\\"div\\",\\"migration-layout\\"),left=el(\\"section\\",\\"migration-panel\\"),right=el(\\"section\\",\\"migration-panel\\");\\n      left.append(el(\\"h3\\",\\"\\",\\"CSVを事前検査\\"),el(\\"p\\",\\"\\",\\"最大2MB・2,000行。引用符、改行、全角電話番号にも対応します。\\"));\\n      left.append(car23Form());\\n      const safe=el(\\"div\\",\\"migration-safe\\");safe.append(el(\\"strong\\",\\"\\",\\"事前検査だけでは本データを変更しません\\"),el(\\"span\\",\\"\\",\\"エラー0件を確認し、「検査済みCSVを取り込む」を押した時だけ登録します。\\"));left.append(safe);\\n      right.append(el(\\"h3\\",\\"\\",\\"事前検査結果\\"),el(\\"p\\",\\"\\",\\"エラー・重複・正規化結果を確認\\"));\\n      const preview=el(\\"div\\",\\"migration-preview\\");\\n      if(car23Preview)preview.append(car23PreviewView(car23Preview));\\n      else preview.append(empty(\\"CSVを選択し、「CSVを事前検査」を押してください。\\"));\\n      right.append(preview);\\n      layout.append(left,right);root.append(layout);\\n\\n      const history=el(\\"section\\",\\"migration-panel\\");history.style.marginTop=\\"15px\\";\\n      history.append(el(\\"h3\\",\\"\\",\\"取込履歴\\"),el(\\"p\\",\\"\\",\\"検査・取込件数と結果を保存\\"));\\n      const list=el(\\"div\\",\\"migration-job-list\\");\\n      jobs.forEach(job=>{\\n        const card=el(\\"article\\",\\"migration-job\\"),head=el(\\"div\\",\\"migration-job-head\\"),text=el(\\"div\\");\\n        text.append(el(\\"h4\\",\\"\\",`${CAR23_TYPE_LABEL[job.import_type]||job.import_type}／${job.file_name||job.import_token}`),el(\\"p\\",\\"\\",`全${job.total_rows}・正常${job.valid_rows}・重複${job.duplicate_rows}・エラー${job.error_rows}・登録${job.inserted_rows}・更新${job.updated_rows}`));\\n        head.append(text,el(\\"span\\",`badge ${job.status===\\"completed\\"?\\"active\\":job.status===\\"failed\\"?\\"danger\\":\\"warn\\"}`,CAR23_STATUS_LABEL[job.status]||job.status));card.append(head);list.append(card);\\n      });\\n      if(!jobs.length)list.append(empty(\\"取込履歴はありません。\\"));\\n      history.append(list);\\n\\n      const exportBox=el(\\"div\\",\\"migration-export\\");\\n      [[\\"customers\\",\\"顧客CSV\\"],[\\"customer_vehicles\\",\\"顧客車両CSV\\"],[\\"inventory\\",\\"販売在庫CSV\\"]].forEach(([type,labelText])=>{\\n        const button=el(\\"button\\",\\"button\\",`${labelText}を書き出す`);button.type=\\"button\\";\\n        button.addEventListener(\\"click\\",async()=>{button.disabled=true;try{const result=await api(`/api/admin/data-migration/export?type=${type}`);car23Download(result.filename,result.csv);showToast(`${result.row_count}件を書き出しました。`)}catch(error){showToast(error.message,true)}finally{button.disabled=false}});\\n        exportBox.append(button);\\n      });\\n      history.append(exportBox);root.append(history);\\n    }\\n\\n    function car23Form(){\\n      const form=el(\\"form\\",\\"migration-form\\"),type=document.createElement(\\"select\\"),policy=document.createElement(\\"select\\"),file=document.createElement(\\"input\\");\\n      [[\\"customers\\",\\"顧客\\"],[\\"customer_vehicles\\",\\"顧客車両\\"],[\\"inventory\\",\\"販売在庫\\"]].forEach(([value,labelText])=>{const option=el(\\"option\\",\\"\\",labelText);option.value=value;type.append(option)});\\n      [[\\"skip\\",\\"重複はスキップ\\"],[\\"update\\",\\"重複は既存情報を更新\\"]].forEach(([value,labelText])=>{const option=el(\\"option\\",\\"\\",labelText);option.value=value;policy.append(option)});\\n      file.type=\\"file\\";file.accept=\\".csv,text/csv\\";\\n      file.addEventListener(\\"change\\",async()=>{car23FileText=file.files?.[0]?await file.files[0].text():\\"\\"});\\n      const field=(labelText,node)=>{const wrap=el(\\"div\\",\\"migration-field\\");wrap.append(el(\\"label\\",\\"\\",labelText),node);return wrap};\\n      const template=el(\\"button\\",\\"button\\",\\"空のCSVテンプレート\\");template.type=\\"button\\";\\n      template.addEventListener(\\"click\\",async()=>{template.disabled=true;try{const result=await api(`/api/admin/data-migration/template?type=${type.value}`);car23Download(result.filename,result.csv)}catch(error){showToast(error.message,true)}finally{template.disabled=false}});\\n      const preview=el(\\"button\\",\\"button amber\\",\\"CSVを事前検査\\");preview.type=\\"submit\\";\\n      const actions=el(\\"div\\",\\"migration-actions\\");actions.append(template,preview);\\n      form.append(field(\\"取込対象\\",type),field(\\"重複時の処理\\",policy),field(\\"CSVファイル\\",file),actions);\\n      form.addEventListener(\\"submit\\",async event=>{\\n        event.preventDefault();\\n        if(!car23FileText){showToast(\\"CSVファイルを選択してください。\\",true);return}\\n        preview.disabled=true;\\n        try{\\n          car23Preview=await api(\\"/api/admin/data-migration/preview\\",{method:\\"POST\\",body:JSON.stringify({import_type:type.value,duplicate_policy:policy.value,file_name:file.files?.[0]?.name||\\"import.csv\\",csv_text:car23FileText})});\\n          showToast(car23Preview.message);await car23Load();car23Render(document.getElementById(\\"view-migration\\"));\\n        }catch(error){showToast(error.message,true)}\\n        finally{preview.disabled=false}\\n      });\\n      return form;\\n    }\\n\\n    function car23PreviewView(result){\\n      const wrap=el(\\"div\\",\\"migration-preview\\"),job=result.job||{},summary=el(\\"div\\",\\"migration-summary\\");\\n      [[\\"全行\\",job.total_rows],[\\"正常\\",job.valid_rows],[\\"重複\\",job.duplicate_rows],[\\"エラー\\",job.error_rows]].forEach(([labelText,value])=>{const box=el(\\"div\\");box.append(el(\\"span\\",\\"\\",labelText),el(\\"strong\\",\\"\\",String(value||0)));summary.append(box)});\\n      wrap.append(summary);\\n      (result.preview||[]).slice(0,30).forEach(row=>{\\n        const card=el(\\"article\\",`migration-row ${row.status}`),main=Object.entries(row.normalized_data||{}).filter(([,value])=>value!==null&&value!==\\"\\").slice(0,5).map(([key,value])=>`${key}: ${value}`).join(\\"／\\");\\n        card.append(el(\\"strong\\",\\"\\",`行${row.row_number}\u3000${row.status===\\"valid\\"?\\"正常\\":row.status===\\"duplicate\\"?\\"重複\\":\\"エラー\\"}`),el(\\"span\\",\\"\\",row.duplicate_reason||row.error_codes?.join(\\"、\\")||main),el(\\"span\\",\\"\\",main));wrap.append(card);\\n      });\\n      if(job.error_rows===0&&job.status===\\"previewed\\"){\\n        const commit=el(\\"button\\",\\"button primary\\",\\"検査済みCSVを取り込む\\");commit.type=\\"button\\";\\n        commit.addEventListener(\\"click\\",async()=>{\\n          if(!confirm(`全${job.total_rows}行を取り込みます。重複方針は「${job.duplicate_policy===\\"update\\"?\\"更新\\":\\"スキップ\\"}」です。続けますか？`))return;\\n          commit.disabled=true;\\n          try{const done=await api(`/api/admin/data-migration/${job.id}/commit`,{method:\\"POST\\",body:JSON.stringify({confirmed:true})});showToast(done.message);car23Preview=null;car23FileText=\\"\\";await car23Load();car23Render(document.getElementById(\\"view-migration\\"))}catch(error){showToast(error.message,true)}finally{commit.disabled=false}\\n        });\\n        wrap.append(commit);\\n      }else if(job.error_rows>0){\\n        wrap.append(el(\\"div\\",\\"notice\\",`エラー${job.error_rows}件があります。CSVを修正して再度事前検査してください。`));\\n      }\\n      return wrap;\\n    }\\n"')

          if "DPRO CAR STEP CAR-23 DATA MIGRATION" not in owner:
              owner=owner.replace("</style>",owner_css+"\n  </style>",1)

          financial_view='        <section class="section-view" id="view-financials" hidden></section>'
          if 'id="view-migration"' not in owner:
              if owner.count(financial_view)!=1:
                  raise SystemExit("データ移行画面の追加位置を確認できません。")
              owner=owner.replace(financial_view,financial_view+'\n        <section class="section-view" id="view-migration" hidden></section>',1)

          financial_section='      {id:"financials",icon:"票",label:"帳票",kicker:"FINANCIAL DOCUMENTS",title:"請求書・領収書・精算書",description:"入出金・契約から帳票を作成し、発行・再発行・無効化を管理します。",count:()=>car22Data?.documents?.length||0},'
          migration_section=financial_section+'\n      {id:"migration",icon:"移",label:"データ移行",kicker:"CSV DATA MIGRATION",title:"顧客・車両・在庫CSV移行",description:"CSVを事前検査し、重複処理を確認してから安全に取り込みます。",count:()=>car23Data?.jobs?.length||0},'
          if 'id:"migration"' not in owner:
              if owner.count(financial_section)!=1:
                  raise SystemExit("データ移行メニューの追加位置を確認できません。")
              owner=owner.replace(financial_section,migration_section,1)

          renderer='payments:renderPayments,financials:renderFinancials,team:renderTeam'
          if 'migration:renderMigration' not in owner:
              if owner.count(renderer)!=1:
                  raise SystemExit("データ移行レンダラーの追加位置を確認できません。")
              owner=owner.replace(renderer,'payments:renderPayments,financials:renderFinancials,migration:renderMigration,team:renderTeam',1)

          if "const CAR23_TYPE_LABEL=" not in owner:
              marker='    function renderTeam(){'
              if owner.count(marker)!=1:
                  raise SystemExit("CAR-23 JavaScript追加位置を確認できません。")
              owner=owner.replace(marker,owner_js+"\n"+marker,1)

          owner=owner.replace(old,new)
          owner=owner.replace(
              "<title>オーナーPC管理 CAR-22｜DPRO中古車センター</title>",
              "<title>オーナーPC管理 CAR-23｜DPRO中古車センター</title>",
              1,
          )
          owner=owner.replace(
              "買取から帳票発行まで、一元管理。",
              "買取からデータ移行まで、一元管理。",
              1,
          )
          owner=owner.replace(
              "査定・在庫・契約・入出金・請求書・領収書・精算書を同じ画面で確認します。",
              "査定・在庫・契約・帳票・既存データ移行を同じ画面で管理します。",
              1,
          )

          config=config.replace(
              " * STEP CAR-22 請求書・領収書・買取支払明細・精算書管理",
              " * STEP CAR-23 顧客・車両・在庫CSV移行・重複検査・取込履歴",
              1,
          )
          config=re.sub(
              r'version:\s*"[^"]+"',
              f'version: "{new}"',
              config,
              count=1,
          )
          config=config.replace(
              "  financialDocumentServerPdfGeneration: false,",
              "  financialDocumentServerPdfGeneration: false,\n  ownerDataMigration: true,\n  customerCsvImport: true,\n  customerVehicleCsvImport: true,\n  inventoryCsvImport: true,\n  dataMigrationPreviewBeforeCommit: true,\n  dataMigrationAutomaticCommit: false,",
              1,
          )

          system=system.replace(
              "<title>システム確認 CAR-22｜DPRO中古車センター</title>",
              "<title>システム確認 CAR-23｜DPRO中古車センター</title>",
              1,
          )
          system=system.replace(
              "CAR-22 営業前システム確認",
              "CAR-23 営業前システム確認",
              1,
          )
          system=system.replace(
              "CAR-22 請求書・領収書・買取支払明細・精算書管理",
              "CAR-23 顧客・車両・在庫CSV移行・重複検査・取込履歴",
              1,
          )

          label_marker='financial_document_browser_print:"印刷・PDF保存",admin_guard:'
          if "car23_data_migration_schema" not in system:
              if system.count(label_marker)!=1:
                  raise SystemExit("system-checkのCAR-23ラベル追加位置を確認できません。")
              system=system.replace(
                  label_marker,
                  'financial_document_browser_print:"印刷・PDF保存",car23_data_migration_schema:"CAR-23安全DB",owner_data_migration_overview:"CSV移行一覧API",data_migration_csv_parser:"CSV引用符解析",data_migration_duplicate_guard:"重複判定",data_migration_preview_before_commit:"事前検査必須",data_migration_export:"CSV書出し",admin_guard:',
                  1,
              )

          count_marker='financial_document_events:"帳票履歴",open_tasks:"未完了タスク"'
          if 'data_import_jobs:"CSV取込履歴"' not in system:
              if system.count(count_marker)!=1:
                  raise SystemExit("system-check件数追加位置を確認できません。")
              system=system.replace(
                  count_marker,
                  'financial_document_events:"帳票履歴",data_import_jobs:"CSV取込履歴",data_import_rows:"CSV検査行",open_tasks:"未完了タスク"',
                  1,
              )

          required_owner=[
              new,
              'id="view-migration"',
              'id:"migration"',
              "renderMigration",
              "CSVを事前検査",
              "検査済みCSVを取り込む",
              "dataMigrationAutomaticCommit",
          ]
          missing=[marker for marker in required_owner if marker not in owner]
          if missing:
              raise SystemExit(f"owner.html検査失敗: {missing}")
          if new not in config:
              raise SystemExit("config.js検査失敗")
          if "car23_data_migration_schema" not in system:
              raise SystemExit("system-check.html検査失敗")

          OWNER.write_text(owner,encoding="utf-8")
          CONFIG.write_text(config,encoding="utf-8")
          SYSTEM.write_text(system,encoding="utf-8")
          print("CAR-23 frontend update: OK")
          PY

      - name: Validate CAR-23 frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          requirements={
            "owner.html":[
              "CAR-23-DATA-MIGRATION-CSV-IMPORT-EXPORT-20260724",
              "view-migration",
              "renderMigration",
              "CSVを事前検査",
              "検査済みCSVを取り込む",
              "自動登録せず",
            ],
            "config.js":[
              "CAR-23-DATA-MIGRATION-CSV-IMPORT-EXPORT-20260724",
              "ownerDataMigration",
              "customerCsvImport",
              "inventoryCsvImport",
              "dataMigrationAutomaticCommit: false",
            ],
            "system-check.html":[
              "CAR-23",
              "car23_data_migration_schema",
              "data_migration_csv_parser",
              "data_import_jobs",
            ],
          }
          for filename,markers in requirements.items():
              text=Path(filename).read_text(encoding="utf-8")
              missing=[marker for marker in markers if marker not in text]
              if missing:
                  raise SystemExit(f"{filename}検査失敗: {missing}")

          owner=Path("owner.html").read_text(encoding="utf-8")
          scripts=[
            value for value in re.findall(
              r"<script(?:\s+[^>]*)?>(.*?)</script>",
              owner,
              flags=re.S,
            )
            if value.strip()
          ]
          if not scripts:
              raise SystemExit("owner.html JavaScript抽出失敗")
          Path("/tmp/car23-owner.js").write_text(scripts[-1],encoding="utf-8")

          ids=re.findall(r'\bid="([^"]+)"',owner)
          duplicates=sorted({value for value in ids if ids.count(value)>1})
          if duplicates:
              raise SystemExit(f"owner.html重複ID: {duplicates}")
          print("CAR-23 frontend validation: OK")
          PY
          node --check /tmp/car23-owner.js
          node --check config.js
          git diff --check

      - name: Normalize and inspect
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in ("owner.html","config.js","system-check.html"):
              path=Path(filename)
              text=path.read_text(encoding="utf-8")
              path.write_text(
                  "\n".join(line.rstrip(" \t") for line in text.splitlines())+"\n",
                  encoding="utf-8",
              )
          PY
          git diff --check
          git status --short
          git diff --stat

      - name: Commit CAR-23 and remove temporary workflow
        shell: bash
        run: |
          git config user.name "DPRO CAR Automation"
          git config user.email "actions@users.noreply.github.com"
          git add owner.html config.js system-check.html
          git rm --ignore-unmatch .github/workflows/step-car-23-data-migration-csv.yml
          if git diff --cached --quiet; then
            echo "コミット対象の変更はありません。"
            exit 0
          fi
          git commit -m "CAR-23: add safe CSV data migration"
          git push origin main
