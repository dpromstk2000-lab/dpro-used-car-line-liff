name: DPRO CAR STEP CAR-24 R3 System Check Clear Button

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/step-car-24-r3-system-check-clear-button.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-car-step-car-24-r3-system-check
  cancel-in-progress: false

jobs:
  update-system-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply CAR-24-R3 system-check update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path("system-check.html")
          if not path.exists():
              raise SystemExit("system-check.html が見つかりません。")
          text=path.read_text(encoding="utf-8")

          text=text.replace(
              "<title>システム確認 CAR-24｜DPRO中古車センター</title>",
              "<title>システム確認 CAR-24-R3｜DPRO中古車センター</title>",
              1,
          )
          text=text.replace(
              "<small>CAR-24 営業前システム確認</small>",
              "<small>CAR-24-R3 営業前システム確認</small>",
              1,
          )

          old_css=".code-row{display:grid;grid-template-columns:1fr auto;gap:9px}"
          new_css=".code-row{display:grid;grid-template-columns:1fr auto auto;gap:9px}"
          if text.count(old_css)!=1:
              raise SystemExit("管理コード欄CSSを確認できません。")
          text=text.replace(old_css,new_css,1)

          mobile_old="@media(max-width:620px){body{font-size:17px}"
          mobile_new="@media(max-width:620px){body{font-size:17px}.code-row{grid-template-columns:1fr}"
          if text.count(mobile_old)!=1:
              raise SystemExit("スマホCSSを確認できません。")
          text=text.replace(mobile_old,mobile_new,1)

          old_row=(
              '<div class="code-row"><input id="adminCode" type="password" '
              'inputmode="numeric" autocomplete="off" maxlength="32">'
              '<button class="button primary" type="submit">確認を開始</button></div>'
          )
          new_row=(
              '<div class="code-row"><input id="adminCode" type="password" '
              'inputmode="numeric" autocomplete="off" maxlength="32">'
              '<button class="button danger" id="clearAdminCode" '
              'type="button">削除</button>'
              '<button class="button primary" type="submit">確認を開始</button></div>'
          )
          if text.count(old_row)!=1:
              raise SystemExit("管理コード欄を確認できません。")
          text=text.replace(old_row,new_row,1)

          old_api=(
              'async function api(path,options={}){const response=await fetch('
              '`${config.apiBase}${path}`,{...options,headers:{Accept:"application/json",'
              '"Content-Type":"application/json","X-Admin-Key":code.value,...options.headers},'
              'cache:"no-store"});let data={};try{data=await response.json()}catch{}'
              'if(!response.ok||!data.ok)throw new Error(data?.error?.message||'
              'data?.message||"確認に失敗しました。");return data}'
          )
          new_api=(
              'async function api(path,options={}){const response=await fetch('
              '`${config.apiBase}${path}`,{...options,headers:{Accept:"application/json",'
              '"Content-Type":"application/json","X-Admin-Key":code.value,...options.headers},'
              'cache:"no-store"});let data={};try{data=await response.json()}catch{}'
              'if(!response.ok||!data.ok){const message=data?.error?.message||'
              'data?.message||"確認に失敗しました。",errorCode=data?.error?.code?'
              '`（${data.error.code}）`:"";throw new Error(`${message}${errorCode}`)}'
              'return data}'
          )
          if text.count(old_api)!=1:
              raise SystemExit("API処理を確認できません。")
          text=text.replace(old_api,new_api,1)

          anchor='byId("loginForm").addEventListener("submit",e=>{e.preventDefault();login()});'
          addition=(
              'byId("clearAdminCode").addEventListener("click",()=>{'
              'code.value="";byId("loginError").hidden=true;code.focus()});'
          )
          if text.count(anchor)!=1:
              raise SystemExit("イベント追加位置を確認できません。")
          text=text.replace(anchor,addition+anchor,1)

          required=[
              "CAR-24-R3",
              'id="clearAdminCode"',
              'type="button">削除</button>',
              'code.value=""',
              "data.error.code",
              "grid-template-columns:1fr auto auto",
          ]
          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit(f"更新検査失敗: {missing}")

          path.write_text(text,encoding="utf-8")
          print("CAR-24-R3 system-check update: OK")
          PY

      - name: Validate system-check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path("system-check.html").read_text(encoding="utf-8")
          required=[
              "CAR-24-R3",
              'id="clearAdminCode"',
              'type="button">削除</button>',
              'code.value=""',
              "data.error.code",
          ]
          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit(f"system-check検査失敗: {missing}")
          if text.count('id="clearAdminCode"')!=1:
              raise SystemExit("削除ボタンID重複")
          scripts=[s for s in re.findall(r"<script(?:\\s+[^>]*)?>(.*?)</script>",text,flags=re.S) if s.strip()]
          if not scripts:
              raise SystemExit("JavaScript抽出失敗")
          Path("/tmp/car24-r3-system-check.js").write_text(scripts[-1],encoding="utf-8")
          print("CAR-24-R3 frontend validation: OK")
          PY
          node --check /tmp/car24-r3-system-check.js

      - name: Normalize and inspect
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path("system-check.html")
          text=path.read_text(encoding="utf-8")
          path.write_text("\\n".join(line.rstrip(" \\t") for line in text.splitlines())+"\\n",encoding="utf-8")
          PY
          git diff --check
          git status --short

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "DPRO CAR Automation"
          git config user.email "actions@users.noreply.github.com"
          git add system-check.html
          git rm --ignore-unmatch .github/workflows/step-car-24-r3-system-check-clear-button.yml
          if git diff --cached --quiet; then
            echo "コミット対象の変更はありません。"
            exit 0
          fi
          git commit -m "CAR-24-R3: fix system check and add admin code clear button"
          git push origin main
