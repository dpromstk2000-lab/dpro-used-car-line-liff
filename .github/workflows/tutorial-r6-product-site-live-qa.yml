name: CAR R6 Product Site LIVE QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tutorial-r6-product-site-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/used-car.html
  TUTORIAL_URL: https://dpromstk2000-lab.github.io/dpro-used-car-line-liff/?demo=1&tutorial=1
  GUIDE_URL: https://dpromstk2000-lab.github.io/dpro-used-car-line-liff/demo-guide.html?demo=1
  QUICK_PDF_URL: https://dpromstk2000-lab.github.io/dpro-used-car-line-liff/DPRO_TUTORIAL_CAR_QUICK_START_V1.0.pdf
  DETAIL_PDF_URL: https://dpromstk2000-lab.github.io/dpro-used-car-line-liff/DPRO_TUTORIAL_CAR_DETAILED_MANUAL_V1.0.pdf
  PRODUCT_REPO: dpromstk2000-lab/dpro-line-systems-site
  PREWRITE_SHA: 88178de8f3d6ff57dd220c0f2f5c255ccb8da13c
  R6_MARKER: CAR-R6-V1.0-20260829
  QUICK_SHA256: 619edb8eeb0c7dd296fd4f40ba6a815d56fb9567cb6c47df57c41fd8217c17d8
  DETAIL_SHA256: 9e720284a56b17e72d3554d3dac6cc9c055e5efa2e1dcb7ae34adeb1a8349ae1

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run CAR R6 exact-width LIVE QA
        shell: bash
        run: |
          mkdir -p r6-evidence/screenshots
          cat > car-r6-live-qa.cjs <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const { chromium, request } = require('playwright');
          const E = process.env;
          const widths = [
            {width:1440,height:1000},
            {width:1024,height:768},
            {width:390,height:844},
            {width:320,height:720}
          ];
          const expectedLinks = {
            tutorial:E.TUTORIAL_URL,
            guide:E.GUIDE_URL,
            'quick-pdf':E.QUICK_PDF_URL,
            'detail-pdf':E.DETAIL_PDF_URL
          };
          const result = {
            R6:'HOLD', marker:E.R6_MARKER, product_url:E.PRODUCT_URL,
            product_repo:E.PRODUCT_REPO, prewrite_sha:E.PREWRITE_SHA,
            product_main:null, forward_only:null, mirror_identical:null,
            preserved:{}, resource_http:{}, resource_sha256:{}, viewports:{},
            errors:[], business_mutations:[], finished_at:null
          };
          const fail = m => result.errors.push(String(m));
          const sha256 = b => crypto.createHash('sha256').update(b).digest('hex');
          const sleep = ms => new Promise(r=>setTimeout(r,ms));

          (async()=>{
            const api = await request.newContext({extraHTTPHeaders:{'Cache-Control':'no-cache','Pragma':'no-cache'}});
            try {
              // Wait for GitHub Pages to publish the R6 marker.
              let published=false;
              for (let i=0;i<48;i++) {
                try {
                  const r=await api.get(`${E.PRODUCT_URL}?r6qa=${Date.now()}`,{timeout:30000});
                  const t=await r.text();
                  if (r.status()===200 && t.includes(`data-tutorial-r6="${E.R6_MARKER}"`)) { published=true; break; }
                } catch(_) {}
                await sleep(5000);
              }
              if (!published) fail('Product Site R6 marker not published');

              // Verify Product Site main is forward-only from the R6 prewrite lock.
              try {
                const br=await api.get(`https://api.github.com/repos/${E.PRODUCT_REPO}/branches/main`,{timeout:30000});
                const bj=await br.json(); result.product_main=bj?.commit?.sha || null;
                if (!result.product_main) fail('Product Site main SHA unavailable');
                else {
                  const cr=await api.get(`https://api.github.com/repos/${E.PRODUCT_REPO}/compare/${E.PREWRITE_SHA}...${result.product_main}`,{timeout:30000});
                  const cj=await cr.json();
                  result.forward_only=['ahead','identical'].includes(cj?.status);
                  if (!result.forward_only) fail(`forward-only failed: ${cj?.status}`);
                }
              } catch(e) { fail(`forward-only check failed: ${e.message}`); }

              // Verify HTML/TEXT mirror bytes are identical at current main.
              try {
                const h=await api.get(`https://raw.githubusercontent.com/${E.PRODUCT_REPO}/main/systems/used-car.html?x=${Date.now()}`,{timeout:30000});
                const t=await api.get(`https://raw.githubusercontent.com/${E.PRODUCT_REPO}/main/systems/used-car.html.txt?x=${Date.now()}`,{timeout:30000});
                const hb=await h.body(), tb=await t.body();
                result.mirror_identical=h.status()===200 && t.status()===200 && Buffer.compare(hb,tb)===0;
                if (!result.mirror_identical) fail('HTML/TEXT mirror mismatch');
              } catch(e) { fail(`mirror check failed: ${e.message}`); }

              // Verify four public resources, including exact PDF hashes from R5 PASS.
              const resources={tutorial:E.TUTORIAL_URL,guide:E.GUIDE_URL,'quick-pdf':E.QUICK_PDF_URL,'detail-pdf':E.DETAIL_PDF_URL};
              for (const [k,url] of Object.entries(resources)) {
                try {
                  const r=await api.get(url,{timeout:30000}); const b=await r.body();
                  result.resource_http[k]=r.status();
                  if (r.status()!==200) fail(`${k} HTTP ${r.status()}`);
                  if (k==='quick-pdf' || k==='detail-pdf') {
                    const h=sha256(b); result.resource_sha256[k]=h;
                    const exp=k==='quick-pdf'?E.QUICK_SHA256:E.DETAIL_SHA256;
                    if (h!==exp) fail(`${k} SHA256 mismatch`);
                    if (!b.subarray(0,5).toString().startsWith('%PDF')) fail(`${k} not PDF`);
                  }
                } catch(e) { fail(`${k} request failed: ${e.message}`); }
              }

              const browser=await chromium.launch({headless:true});
              try {
                for (const vp of widths) {
                  const ctx=await browser.newContext({viewport:vp});
                  const page=await ctx.newPage();
                  const pageErrors=[], consoleErrors=[], mutations=[];
                  page.on('pageerror',e=>pageErrors.push(String(e)));
                  page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
                  page.on('request',r=>{ if(!['GET','HEAD','OPTIONS'].includes(r.method())) mutations.push({method:r.method(),url:r.url()}); });
                  try {
                    const resp=await page.goto(`${E.PRODUCT_URL}?r6qa=${Date.now()}-${vp.width}`,{waitUntil:'domcontentloaded',timeout:45000});
                    if (!resp || resp.status()!==200) fail(`width ${vp.width}: product HTTP ${resp?.status()}`);
                    await page.waitForSelector(`body[data-tutorial-r6="${E.R6_MARKER}"]`,{timeout:20000});
                    await page.waitForTimeout(500);
                    const data=await page.evaluate((expected)=>{
                      const links={};
                      for (const k of Object.keys(expected)) {
                        const a=document.querySelector(`[data-r6-link="${k}"]`);
                        links[k]=a ? {href:a.href,display:getComputedStyle(a).display,visibility:getComputedStyle(a).visibility} : null;
                      }
                      return {
                        innerWidth:window.innerWidth,
                        documentScrollWidth:document.documentElement.scrollWidth,
                        bodyScrollWidth:document.body.scrollWidth,
                        links,
                        price:document.body.innerText.includes('月額5,500円（税込）'),
                        line:!!document.querySelector('a[href="https://lin.ee/YxJGXV6D"]'),
                        demo:!!document.querySelector('a[href="https://dpromstk2000-lab.github.io/dpro-used-car-line-liff/?demo=1"]'),
                        lp:!!document.querySelector('a[href="../lp-car.html"]'),
                        flyerHtml:!!document.querySelector('a[href="../flyer-car.html"]'),
                        flyerPdf:!!document.querySelector('a[href="../flyer-car.pdf"]')
                      };
                    }, expectedLinks);
                    const overflow=Math.max(0,data.documentScrollWidth-data.innerWidth,data.bodyScrollWidth-data.innerWidth);
                    if (data.innerWidth!==vp.width) fail(`width ${vp.width}: innerWidth ${data.innerWidth}`);
                    if (overflow!==0) fail(`width ${vp.width}: positive overflow ${overflow}`);
                    for (const [k,u] of Object.entries(expectedLinks)) {
                      if (!data.links[k]) fail(`width ${vp.width}: ${k} missing`);
                      else if (data.links[k].href!==u) fail(`width ${vp.width}: ${k} href mismatch`);
                      else if (data.links[k].display==='none' || data.links[k].visibility==='hidden') fail(`width ${vp.width}: ${k} hidden`);
                    }
                    for (const k of ['price','line','demo','lp','flyerHtml','flyerPdf']) if (!data[k]) fail(`width ${vp.width}: preserved ${k} missing`);

                    // Keyboard reachability: Tab through the document until all four R6 links receive focus.
                    await page.evaluate(()=>{ document.activeElement?.blur?.(); window.scrollTo(0,0); });
                    const focused=[];
                    for (let i=0;i<120 && focused.length<4;i++) {
                      await page.keyboard.press('Tab');
                      const k=await page.evaluate(()=>document.activeElement?.getAttribute?.('data-r6-link') || null);
                      if (k && !focused.includes(k)) focused.push(k);
                    }
                    const keyboardPass=Object.keys(expectedLinks).every(k=>focused.includes(k));
                    if (!keyboardPass) fail(`width ${vp.width}: keyboard focus missing ${JSON.stringify(focused)}`);
                    if (pageErrors.length) fail(`width ${vp.width}: pageerror ${JSON.stringify(pageErrors)}`);
                    if (consoleErrors.length) fail(`width ${vp.width}: console error ${JSON.stringify(consoleErrors)}`);
                    if (mutations.length) fail(`width ${vp.width}: unsafe write ${JSON.stringify(mutations)}`);
                    result.business_mutations.push(...mutations);
                    result.viewports[String(vp.width)]={...data,overflow,pageErrors,consoleErrors,unsafe_write_requests:mutations,keyboard_focus_order:focused,keyboard_focus:keyboardPass};
                    await page.screenshot({path:`r6-evidence/screenshots/product-${vp.width}x${vp.height}.png`,fullPage:true});
                  } catch(e) { fail(`width ${vp.width}: ${e.message}`); }
                  await ctx.close();
                }
              } finally { await browser.close(); }

              result.preserved={
                price:Object.values(result.viewports).every(v=>v.price),
                line_cta:Object.values(result.viewports).every(v=>v.line),
                demo:Object.values(result.viewports).every(v=>v.demo),
                lp:Object.values(result.viewports).every(v=>v.lp),
                flyer_html:Object.values(result.viewports).every(v=>v.flyerHtml),
                flyer_pdf:Object.values(result.viewports).every(v=>v.flyerPdf)
              };
              result.finished_at=new Date().toISOString();
              result.business_mutation_count=result.business_mutations.length;
              result.R6=result.errors.length===0?'PASS':'HOLD';
              fs.writeFileSync('r6-evidence/R6_LIVE_QA.json',JSON.stringify(result,null,2)+'\n');
              console.log(JSON.stringify(result,null,2));
              if (result.R6!=='PASS') process.exitCode=1;
            } finally { await api.dispose(); }
          })().catch(e=>{ console.error(e); process.exit(1); });
          NODE
          node car-r6-live-qa.cjs

      - name: Upload R6 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CAR-R6-PRODUCT-SITE-LIVE-QA
          path: r6-evidence
          if-no-files-found: warn
