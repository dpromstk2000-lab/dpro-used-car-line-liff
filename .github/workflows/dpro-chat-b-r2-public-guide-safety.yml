name: DPRO CHAT B R2 CAR Public Demo Safety

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Repository guard
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "dpromstk2000-lab/dpro-used-car-line-liff"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply minimal R2 fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('demo-guide.html'); s=p.read_text(encoding='utf-8')
          def rep(a,b):
              global s
              if a not in s: raise SystemExit('expected copy not found: '+a[:130])
              s=s.replace(a,b)
          repls=[
          ('<div class="kicker">PUBLIC OPERATION DEMO / V1.0</div>','<div class="kicker">DPRO 中古車 / 公開操作デモ</div>'),
          ('<small>CHOOSE A SCREEN</small>','<small>画面を選ぶ</small>'),
          ('<small>RECOMMENDED JOURNEY</small>','<small>おすすめの確認順</small>'),
          ('<small>GUIDE CENTER / R4</small>','<small>操作ガイド</small>'),
          ('R3のTutorialと同じ10ステップ・同じ状態を使います。ここから開始、続きから、最初から、各ステップ指定のすべてが同じTutorialへ接続されます。','操作ガイドの10項目を、最初から・続きから・もう一度見る、の操作で確認できます。'),
          ('aria-label="DPRO CAR Guide Center"','aria-label="DPRO CAR 操作ガイド"'),
          ('>Start / 最初から開始</button>','>最初から開始</button>'),
          ('>Resume / 続きから</button>','>続きから再開</button>'),
          ('>Replay / 最初から</button>','>もう一度見る</button>'),
          ('Tutorialを読み込み中…','操作ガイドを読み込み中…'),
          ('管理系画面は demo=1 の営業デモとデモ用管理コード 1234 を使用してください。','管理系画面は demo=1 の営業デモで、デモ用の認証情報が自動設定されます。'),
          ('{"label":"CUSTOMER FLOW"','{"label":"お客様の流れ"'),
          ('{"label":"DEMO INFO","text":"管理系は demo=1 でデモコード1234を自動設定。公開デモは架空の顧客・車両情報のみ。"}','{"label":"デモについて","text":"管理系は demo=1 でデモ用の認証情報を自動設定します。公開デモは架空の顧客・車両情報のみ使用します。"}'),
          ('{"label":"SCREEN STRUCTURE"','{"label":"画面構成"'),
          ('"step":"01 / お客様 / PRIMARY EXPERIENCE"','"step":"01 / お客様 / はじめに"'),
          ('"step":"02 / お客様 / INVENTORY"','"step":"02 / お客様 / 公開在庫"'),
          ('"step":"03 / スタッフiPad / OPERATIONS"','"step":"03 / スタッフiPad / 現場管理"'),
          ('"note":"demo=1 ではデモ用管理コード1234が自動設定されます。架空の営業データだけを操作してください。"','"note":"demo=1 ではデモ用の認証情報が自動設定されます。架空の営業データだけを操作してください。"'),
          ('"step":"04–05 / オーナーPC / SAME SCREEN"','"step":"04–05 / オーナーPC / 同じ画面"'),
          ('document.getElementById("footer").textContent = `${CONFIG.systemName}｜PUBLIC OPERATION DEMO V1.0`;','document.getElementById("footer").textContent = `${CONFIG.systemName}｜公開操作デモ`;'),
          ('${x.sameScreen ? " / SAME SCREEN" : ""}','${x.sameScreen ? " / 同じ画面" : ""}'),
          ('statusNode.textContent = `状態：${state.status} / ${state.step} of 10`;','const stateLabel={idle:"未開始",active:"進行中",paused:"一時停止",completed:"完了",skipped:"スキップ済み"}[state.status]||"確認中"; statusNode.textContent = `状態：${stateLabel} / ${state.step} / 10`;'),
          ('<div class="guide-id">${esc(step.id)} / ${index + 1} of 10</div>','<div class="guide-id">手順 ${index + 1} / 10</div>'),
          ('''        <div class="guide-meta">
                    <code>route: ${esc(step.route)}</code>
                    <code>target: ${esc(step.primary)}</code>
                    <code>fallback: ${esc(step.fallback || "なし")}</code>
                  </div>
          ''',''),
          ('このステップから開始','この手順から開始'),
          ('Tutorialを読み込めませんでした。再読込してください。','操作ガイドを読み込めませんでした。再読込してください。'),
          ('>Owner PCへ戻る</a>','>オーナーPCへ戻る</a>')
          ]
          for a,b in repls: rep(a,b)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Static safety QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('demo-guide.html').read_text(encoding='utf-8')
          assert s.count('1234') == 1, s.count('1234')
          assert '"adminCode": "1234"' in s
          for x in ['PUBLIC OPERATION DEMO / V1.0','GUIDE CENTER / R4','R3のTutorial','>Start /','>Resume /','>Replay /','demoコード1234','デモ用管理コード1234','route: ${esc(step.route)}','target: ${esc(step.primary)}','fallback: ${esc(step.fallback','${esc(step.id)} / ${index + 1} of 10',' / SAME SCREEN']:
              assert x not in s, x
          for x in ['最初から開始','続きから再開','もう一度見る','オーナーPCへ戻る','"adminCode": "1234"','DPRO_CAR_TUTORIAL','data-step-id="${esc(step.id)}"']:
              assert x in s, x
          PY
          git diff --check

      - name: Commit forward-only fix
        shell: bash
        run: |
          git config user.name "DPRO CHAT B R2"
          git config user.email "actions@users.noreply.github.com"
          git rm ".github/workflows/dpro-chat-b-r2-public-guide-safety.yml"
          git add demo-guide.html
          git commit -m "DPRO CHAT B R2: public guide and demo safety"
          git push
