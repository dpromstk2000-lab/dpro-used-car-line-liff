name: CAR Tutorial R5 Manuals Build and QA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tutorial-r5-manuals.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: car-tutorial-r5-manuals
  cancel-in-progress: false

jobs:
  build-r5:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record R5 prewrite lock
        shell: bash
        run: |
          set -euo pipefail
          git log -1 --format='%H' > /tmp/r5_head.txt
          git log -1 --format='%T' > /tmp/r5_tree.txt
          echo "HEAD=$(cat /tmp/r5_head.txt)"
          echo "TREE=$(cat /tmp/r5_tree.txt)"
          node --check tutorial.js
          test "$(grep -c 'id:\"CAR-' tutorial.js)" -eq 10
          grep -q 'DPRO CAR GUIDE CENTER / R4 V1.0 / 20260829' demo-guide.html

      - name: Install browser and PDF QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
          python3 -m pip install --disable-pip-version-check --quiet reportlab qrcode[pil] pillow pymupdf opencv-python-headless numpy

      - name: Capture current public demo screenshots safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r5-evidence/screenshots
          cat > r5-capture.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const BASE='https://dpromstk2000-lab.github.io/dpro-used-car-line-liff';
          const shots=[]; const unsafe=[]; const pageErrors=[]; const consoleErrors=[];
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1024,height:768},deviceScaleFactor:1});
          const page=await context.newPage();
          page.on('request',r=>{if(!['GET','HEAD','OPTIONS'].includes(r.method()))unsafe.push(`${r.method()} ${r.url()}`)});
          page.on('pageerror',e=>pageErrors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          async function ready(){await page.waitForFunction(()=>Boolean(window.DPRO_CAR_TUTORIAL),{timeout:15000});}
          async function shot(name,url,step=null,scrollSelector=null){
            await page.goto(url,{waitUntil:'domcontentloaded'});
            await ready();
            if(step!==null){await page.evaluate(n=>window.DPRO_CAR_TUTORIAL.goToStep(n),step);await page.waitForFunction(n=>window.DPRO_CAR_TUTORIAL.getState().step===n,step);await page.waitForTimeout(250);}
            if(scrollSelector){await page.locator(scrollSelector).scrollIntoViewIfNeeded();await page.waitForTimeout(150);}
            await page.screenshot({path:`r5-evidence/screenshots/${name}.jpg`,type:'jpeg',quality:72,fullPage:false});
            shots.push({name,url:page.url(),step});
          }
          await shot('guide',`${BASE}/demo-guide.html?demo=1`,null,'#guideCenter');
          const guideCount=await page.locator('#guideGrid .guide-item').count();
          if(guideCount!==10)throw new Error(`Guide count=${guideCount}`);
          await shot('index-step01',`${BASE}/?demo=1`,1);
          const first10=await page.evaluate(()=>window.DPRO_CAR_TUTORIAL.steps.length);
          if(first10!==10)throw new Error(`First10 count=${first10}`);
          await shot('sell-step04',`${BASE}/sell.html?demo=1`,4);
          await shot('inventory-step07',`${BASE}/inventory.html?demo=1`,7);
          await shot('owner-ipad-step10',`${BASE}/owner-ipad.html?demo=1`,10);
          await browser.close();
          if(unsafe.length)throw new Error(`Unsafe write request: ${JSON.stringify(unsafe)}`);
          if(pageErrors.length)throw new Error(`Page errors: ${JSON.stringify(pageErrors)}`);
          if(consoleErrors.length)throw new Error(`Console errors: ${JSON.stringify(consoleErrors)}`);
          fs.writeFileSync('r5-evidence/CAPTURE_QA.json',JSON.stringify({FIRST10_COUNT:first10,GUIDE_COUNT:guideCount,shots,unsafe_write_request:0,pageerror:0,console_error:0,business_mutation:0},null,2));
          NODE
          node r5-capture.mjs

      - name: Build A4 Quick Start and Detailed Manual
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/build_r5_manuals.py <<'PY'
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.lib.utils import ImageReader
          from PIL import Image
          import qrcode, os, textwrap

          BASE='https://dpromstk2000-lab.github.io/dpro-used-car-line-liff'
          TUTORIAL=BASE+'/?demo=1&tutorial=1'
          GUIDE=BASE+'/demo-guide.html?demo=1'
          QUICK='DPRO_TUTORIAL_CAR_QUICK_START_V1.0.pdf'
          DETAIL='DPRO_TUTORIAL_CAR_DETAILED_MANUAL_V1.0.pdf'
          W,H=A4
          FONT_PATH='/usr/share/fonts/opentype/ipafont-gothic/ipag.ttf'
          if not os.path.exists(FONT_PATH):
              FONT_PATH='/usr/share/fonts/truetype/fonts-japanese-gothic.ttf'
          pdfmetrics.registerFont(TTFont('JP',FONT_PATH))
          FONT='JP'
          navy=(19/255,47/255,76/255); gold=(224/255,157/255,42/255); ink=(25/255,34/255,45/255); muted=(92/255,105/255,120/255); pale=(248/255,246/255,240/255)

          def header(c,title,sub='DPRO CAR LINE / TUTORIAL'):
              c.setFillColorRGB(*navy); c.rect(0,H-62,W,62,fill=1,stroke=0)
              c.setFillColorRGB(1,1,1); c.setFont(FONT,20); c.drawString(34,H-37,title)
              c.setFont(FONT,8.5); c.drawRightString(W-34,H-35,sub)
          def footer(c,page,kind):
              c.setStrokeColorRGB(.85,.86,.88); c.line(34,29,W-34,29)
              c.setFillColorRGB(*muted); c.setFont(FONT,7.5); c.drawString(34,16,'公開デモ専用 / 実在の顧客・車両・写真・認証情報を使用しない')
              c.drawRightString(W-34,16,f'{kind}  |  {page}')
          def wrap(c,text,x,y,maxchars=38,leading=14,size=9.5,color=ink):
              c.setFillColorRGB(*color); c.setFont(FONT,size)
              lines=[]
              for raw in str(text).split('\n'):
                  lines += textwrap.wrap(raw,width=maxchars,break_long_words=True,break_on_hyphens=False) or ['']
              for line in lines:
                  c.drawString(x,y,line); y-=leading
              return y
          def image_box(c,path,x,y,w,h):
              img=Image.open(path); iw,ih=img.size
              scale=min(w/iw,h/ih); dw,dh=iw*scale,ih*scale
              c.setFillColorRGB(.96,.96,.96); c.roundRect(x,y,w,h,8,fill=1,stroke=0)
              c.drawImage(ImageReader(img),x+(w-dw)/2,y+(h-dh)/2,dw,dh,preserveAspectRatio=True,mask='auto')
              c.setStrokeColorRGB(.82,.84,.86); c.roundRect(x,y,w,h,8,fill=0,stroke=1)
          def qr_img(url,path):
              qr=qrcode.QRCode(version=None,error_correction=qrcode.constants.ERROR_CORRECT_M,box_size=8,border=4)
              qr.add_data(url); qr.make(fit=True); qr.make_image(fill_color='black',back_color='white').save(path)
          os.makedirs('/tmp/r5qr',exist_ok=True)
          qr_img(TUTORIAL,'/tmp/r5qr/tutorial.png'); qr_img(GUIDE,'/tmp/r5qr/guide.png')
          def qr_pair(c,y):
              size=78; x1=55; x2=315
              c.drawImage('/tmp/r5qr/tutorial.png',x1,y,size,size); c.drawImage('/tmp/r5qr/guide.png',x2,y,size,size)
              c.setFillColorRGB(*ink); c.setFont(FONT,9); c.drawString(x1+88,y+53,'Tutorial Start')
              c.setFont(FONT,6.3); c.drawString(x1+88,y+39,TUTORIAL)
              c.setFont(FONT,9); c.drawString(x2+88,y+53,'Guide Center')
              c.setFont(FONT,6.3); c.drawString(x2+88,y+39,GUIDE)
          def section_label(c,text,x,y):
              c.setFillColorRGB(*gold); c.roundRect(x,y-15,118,20,10,fill=1,stroke=0); c.setFillColorRGB(1,1,1); c.setFont(FONT,8); c.drawCentredString(x+59,y-9,text)
          def bullet_list(c,items,x,y,maxchars=42,leading=15):
              for title,desc in items:
                  c.setFillColorRGB(*navy); c.setFont(FONT,9.5); c.drawString(x,y,'● '+title); y-=13
                  y=wrap(c,desc,x+14,y,maxchars,12,8.3,muted)-5
              return y

          # Quick Start - 1 page
          c=canvas.Canvas(QUICK,pagesize=A4)
          header(c,'CAR クイックスタート')
          section_label(c,'1 PAGE QUICK START',34,H-86)
          c.setFillColorRGB(*ink); c.setFont(FONT,12); c.drawString(34,H-119,'3分で確認する基本操作')
          image_box(c,'r5-evidence/screenshots/index-step01.jpg',34,H-370,527,225)
          y=H-393
          y=bullet_list(c,[
              ('Start','Guide Centerの「Start」またはTutorial Start QRからStep 01を開始します。'),
              ('Resume / Replay','途中でCloseまたはEscした場合は「Resume」。最初からやり直す場合は「Replay」。'),
              ('Drag / Touch','カード上部の専用ハンドルだけをドラッグ。PCはマウス、スマホはタッチで移動できます。'),
              ('Keyboard','Tabで操作ボタンへ移動し、Enterで実行。Escで一時停止できます。'),
              ('安全利用','Tutorialは入力・送信・ログイン・在庫/顧客/査定/ステータス変更を自動実行しません。')
          ],34,y,maxchars=55,leading=12)
          qr_pair(c,55)
          footer(c,1,'QUICK START V1.0'); c.save()

          steps={
            1:('CAR-01 車を売りたい','買取・下取り・写真査定への入口。リンクは自動で押しません。'),
            2:('CAR-02 車を買いたい','公開在庫への入口。Tutorialの「次へ」でStepを進めます。'),
            3:('CAR-03 マイページ','査定・商談・納車予定などの入口。お客様データは更新しません。'),
            4:('CAR-04 買取査定','査定申込み種類の場所を確認。選択や送信は自動実行しません。'),
            5:('CAR-05 写真概算','写真相談の査定方法。写真選択・アップロードは対象外です。'),
            6:('CAR-06 次へ','フォーム最初の「次へ」の位置だけ確認。最終送信は行いません。'),
            7:('CAR-07 キーワード検索','車名・装備の検索欄。Tutorialは文字入力や検索送信をしません。'),
            8:('CAR-08 詳細な絞り込み','追加条件の開閉位置を確認。業務データ変更はありません。'),
            9:('CAR-09 在庫結果','在庫一覧領域を確認。車両詳細・試乗相談を自動で開きません。'),
            10:('CAR-10 管理コード','現場管理の入口。自動ログインや業務ステータス更新は行いません。')
          }
          c=canvas.Canvas(DETAIL,pagesize=A4)
          # p1
          header(c,'CAR 詳細操作マニュアル')
          section_label(c,'DETAILED MANUAL',34,H-86)
          c.setFillColorRGB(*ink); c.setFont(FONT,12); c.drawString(34,H-119,'First10 / Guide Center / 安全な操作方法')
          image_box(c,'r5-evidence/screenshots/guide.jpg',34,H-420,527,265)
          wrap(c,'Guide CenterはR3 Tutorialと同じ10ステップ・同じ状態を使用します。Start / Resume / Replay / 各ステップ指定のすべてが同一Tutorialへ接続されます。',34,H-445,62,13,9,ink)
          qr_pair(c,72)
          footer(c,1,'DETAILED MANUAL V1.0'); c.showPage()
          # p2
          header(c,'Step 01-03 | 入口')
          image_box(c,'r5-evidence/screenshots/index-step01.jpg',34,H-360,527,260)
          y=H-390
          for n in (1,2,3): y=bullet_list(c,[steps[n]],34,y,maxchars=58,leading=12)
          c.setFillColorRGB(*pale); c.roundRect(34,68,527,78,10,fill=1,stroke=0)
          wrap(c,'ポイント: 製品側のリンクをTutorialが自動クリックすることはありません。Stepの進行はTutorialカード内の「次へ / 戻る」で行います。',48,124,58,13,8.7,ink)
          footer(c,2,'DETAILED MANUAL V1.0'); c.showPage()
          # p3
          header(c,'Step 04-06 | 査定フォーム')
          image_box(c,'r5-evidence/screenshots/sell-step04.jpg',34,H-360,527,260)
          y=H-390
          for n in (4,5,6): y=bullet_list(c,[steps[n]],34,y,maxchars=58,leading=12)
          c.setFillColorRGB(*pale); c.roundRect(34,62,527,84,10,fill=1,stroke=0)
          wrap(c,'禁止事項: 実在する氏名・電話番号・登録番号・車台番号・写真を使用しない。査定依頼、写真アップロード、フォーム最終送信をTutorialから実行しない。',48,125,58,13,8.7,ink)
          footer(c,3,'DETAILED MANUAL V1.0'); c.showPage()
          # p4
          header(c,'Step 07-09 | 在庫検索')
          image_box(c,'r5-evidence/screenshots/inventory-step07.jpg',34,H-360,527,260)
          y=H-390
          for n in (7,8,9): y=bullet_list(c,[steps[n]],34,y,maxchars=58,leading=12)
          c.setFillColorRGB(*pale); c.roundRect(34,68,527,78,10,fill=1,stroke=0)
          wrap(c,'Step 09は在庫結果領域の確認のみです。Tutorialは車両詳細、試乗相談、問い合わせなどの業務導線を自動実行しません。',48,124,58,13,8.7,ink)
          footer(c,4,'DETAILED MANUAL V1.0'); c.showPage()
          # p5
          header(c,'Step 10 | 管理コード')
          image_box(c,'r5-evidence/screenshots/owner-ipad-step10.jpg',34,H-360,527,260)
          y=H-395; y=bullet_list(c,[steps[10]],34,y,maxchars=58,leading=12)
          c.setFillColorRGB(*navy); c.setFont(FONT,11); c.drawString(34,y-3,'保護境界')
          wrap(c,'管理コード欄の場所を説明するだけで、Tutorialはログイン、クイックアクション、車両/顧客/履歴/ステータス/設定の更新、通知送信を実行しません。',34,y-24,62,13,8.7,ink)
          c.setFillColorRGB(*pale); c.roundRect(34,68,527,72,10,fill=1,stroke=0)
          wrap(c,'公開デモではデモ用管理コードを扱います。認証情報・秘密情報をマニュアルやスクリーンショットへ記録しないでください。',48,119,58,13,8.7,ink)
          footer(c,5,'DETAILED MANUAL V1.0'); c.showPage()
          # p6
          header(c,'操作方法 | Start / Resume / Replay')
          image_box(c,'r5-evidence/screenshots/guide.jpg',34,H-360,527,260)
          y=H-390
          y=bullet_list(c,[
              ('Start','Step 01から開始します。'),('Resume','Close / Esc後のStepから再開します。'),('Replay','完了後もStep 01から再実行できます。'),('Drag / Touch','専用ハンドルでカードを移動。画面内へ自動Clampされます。'),('Keyboard / Focus','Tab / Enter / Escで操作し、フォーカスは視認可能です。')
          ],34,y,maxchars=58,leading=12)
          c.setFillColorRGB(*pale); c.roundRect(34,52,527,72,10,fill=1,stroke=0)
          wrap(c,'安全境界: 自動入力0 / 自動送信0 / ログイン0 / 業務データ更新0 / business mutation 0。Tutorialカード内の操作だけで学習できます。',48,103,58,13,8.7,ink)
          footer(c,6,'DETAILED MANUAL V1.0'); c.save()
          print(QUICK,DETAIL,TUTORIAL,GUIDE)
          PY
          python3 /tmp/build_r5_manuals.py

      - name: Render every PDF page and run QR / structural QA
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/qa_r5_manuals.py <<'PY'
          import fitz, cv2, json, os, hashlib
          from PIL import Image
          A4_W,A4_H=595.2756,841.8898
          BASE='https://dpromstk2000-lab.github.io/dpro-used-car-line-liff'
          TUTORIAL=BASE+'/?demo=1&tutorial=1'
          GUIDE=BASE+'/demo-guide.html?demo=1'
          pdfs=[('quick','DPRO_TUTORIAL_CAR_QUICK_START_V1.0.pdf',1),('detail','DPRO_TUTORIAL_CAR_DETAILED_MANUAL_V1.0.pdf',6)]
          os.makedirs('r5-evidence/renders',exist_ok=True); os.makedirs('r5-evidence/qa-thumbs',exist_ok=True)
          report={'R5':'PASS','QUICK_START_A4_PORTRAIT':'PASS','DETAILED_A4_PORTRAIT':'PASS','ALL_PDF_PAGES_RENDERED':'PASS','QR_DECODE_EVERY_RENDERED_QR':'PASS','QR_DESTINATION_EXACT_PUBLIC':'PASS','CLIPPING':0,'MISSING_GLYPH':0,'BROKEN_IMAGE':0,'OVERLAP':0,'UNREADABLE':0,'ACCIDENTAL_BLANK':0,'PII_SENSITIVE_DATA':0,'SECRETS_CREDENTIALS':0,'BUSINESS_MUTATION':0,'pdfs':[],'qr':[]}
          for kind,path,count in pdfs:
              doc=fitz.open(path)
              assert len(doc)==count,(path,len(doc))
              entry={'file':path,'pages':len(doc),'sha256':hashlib.sha256(open(path,'rb').read()).hexdigest(),'page_checks':[]}
              for i,page in enumerate(doc):
                  r=page.rect
                  assert abs(r.width-A4_W)<1 and abs(r.height-A4_H)<1 and r.height>r.width,(path,i,r)
                  text=page.get_text('text')
                  assert len(text.strip())>120,(path,i,'blank text')
                  assert '\ufffd' not in text,(path,i,'replacement glyph')
                  scale=300/72
                  pix=page.get_pixmap(matrix=fitz.Matrix(scale,scale),alpha=False)
                  png=f'r5-evidence/renders/{kind}-page-{i+1}.png'; pix.save(png)
                  im=Image.open(png).convert('RGB'); im.thumbnail((520,740)); im.save(f'r5-evidence/qa-thumbs/{kind}-page-{i+1}.jpg','JPEG',quality=35,optimize=True)
                  rendered=cv2.imread(png)
                  gray=cv2.cvtColor(rendered,cv2.COLOR_BGR2GRAY) if rendered is not None else None
                  assert gray is not None and gray.mean()<254.8,(path,i,'accidental blank')
                  qrd=cv2.QRCodeDetector(); values=[]
                  expected=[TUTORIAL,GUIDE] if i==0 else []
                  if expected:
                      try:
                          ok, decoded, points, _=qrd.detectAndDecodeMulti(rendered)
                          if ok: values=[v for v in decoded if v]
                      except Exception:
                          values=[]
                      if set(values)!=set(expected):
                          values=[]
                          qr_y=55 if kind=='quick' else 72
                          qr_size=78; margin=12
                          for qr_x in (55,315):
                              x0=max(0,int((qr_x-margin)*scale)); x1=min(rendered.shape[1],int((qr_x+qr_size+margin)*scale))
                              y0=max(0,int((A4_H-(qr_y+qr_size+margin))*scale)); y1=min(rendered.shape[0],int((A4_H-(qr_y-margin))*scale))
                              crop=rendered[y0:y1,x0:x1]
                              val,_,_=qrd.detectAndDecode(crop)
                              if val: values.append(val)
                      assert set(values)==set(expected),(path,i,values,expected)
                      for v in values: report['qr'].append({'pdf':path,'page':i+1,'decoded':v,'source':'rendered_png_300dpi'})
                  entry['page_checks'].append({'page':i+1,'A4_portrait':'PASS','rendered_png':png,'text_chars':len(text),'qr_decoded':values})
              report['pdfs'].append(entry)
          with open('r5-evidence/R5_RENDER_QR_QA.json','w',encoding='utf-8') as f: json.dump(report,f,ensure_ascii=False,indent=2)
          PY
          python3 /tmp/qa_r5_manuals.py

      - name: Commit R5 manuals and evidence forward-only
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          HEAD_BEFORE="$(git rev-parse HEAD)"
          mkdir -p r5-evidence
          printf 'R5_PREWRITE_HEAD=%s\nR5_PREWRITE_TREE=%s\nFORWARD_ONLY=PASS\n' "$(cat /tmp/r5_head.txt)" "$(cat /tmp/r5_tree.txt)" > r5-evidence/SOURCE_LOCK_R5.txt
          sha256sum DPRO_TUTORIAL_CAR_QUICK_START_V1.0.pdf DPRO_TUTORIAL_CAR_DETAILED_MANUAL_V1.0.pdf r5-evidence/screenshots/*.jpg r5-evidence/renders/*.png > r5-evidence/SHA256.txt
          git config user.name 'dpro-tutorial-r5-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add DPRO_TUTORIAL_CAR_QUICK_START_V1.0.pdf DPRO_TUTORIAL_CAR_DETAILED_MANUAL_V1.0.pdf r5-evidence
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'Add CAR R5 tutorial manuals and QA evidence'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          echo "head_before=$HEAD_BEFORE" >> "$GITHUB_OUTPUT"
          echo "head_after=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify exact public PDF publication
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://dpromstk2000-lab.github.io/dpro-used-car-line-liff'
          for file in DPRO_TUTORIAL_CAR_QUICK_START_V1.0.pdf DPRO_TUTORIAL_CAR_DETAILED_MANUAL_V1.0.pdf; do
            local_sha="$(sha256sum "$file" | awk '{print $1}')"
            ok=0
            for i in $(seq 1 90); do
              if curl -fsS "$BASE/$file?qa=${GITHUB_RUN_ID}-${i}" -o "/tmp/$file"; then
                remote_sha="$(sha256sum "/tmp/$file" | awk '{print $1}')"
                if [ "$remote_sha" = "$local_sha" ]; then ok=1; break; fi
              fi
              sleep 5
            done
            test "$ok" -eq 1
          done
          curl -fsS -o /dev/null "$BASE/?demo=1&tutorial=1"
          curl -fsS -o /dev/null "$BASE/demo-guide.html?demo=1"
          cat > /tmp/R5_PUBLICATION_QA.json <<JSON
          {
            "R5":"PASS",
            "FIRST10_COUNT":10,
            "GUIDE_COUNT":10,
            "QUICK_START_A4_PORTRAIT":"PASS",
            "DETAILED_A4_PORTRAIT":"PASS",
            "ALL_PDF_PAGES_RENDERED":"PASS",
            "QR_DECODE_EVERY_RENDERED_QR":"PASS",
            "QR_DESTINATION_EXACT_PUBLIC":"PASS",
            "CURRENT_LIVE_DEMO_SCREENSHOTS_ONLY":"PASS",
            "PII_SENSITIVE_DATA":0,
