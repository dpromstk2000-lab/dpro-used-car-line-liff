name: DPRO USED_CAR Product Ready R3 Network Final

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-USED-CAR-PRODUCT-READY-R3-NETWORK-FINAL.yml'

permissions:
  contents: write

jobs:
  used-car-r3-final:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify R2 release source
        shell: bash
        run: |
          set -euo pipefail

          BASE_R2='d8317ef29bc146837135935ea0a76174cc1dc23e'
          git merge-base --is-ancestor "$BASE_R2" HEAD

          test -f config.js
          test -f index.html
          test -f member.html
          test -f owner.html
          test -f owner-ipad.html
          test -f system-check.html

          grep -F 'CAR-25-PRODUCT-READY-R2-20260824' config.js
          grep -F 'DPRO-CONTROL-ADAPTER-1.0-USED_CAR-R2-20260824' config.js
          grep -F 'CAR-DB-PRODUCT-READY-R2-20260824' config.js
          grep -F 'https://cbknucemarcpbscirzyv.supabase.co/functions/v1/used-car-product-ready-adapter' config.js

          echo "SOURCE_VERIFY=PASS"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Fresh network proof
        id: network
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p product-ready-evidence/used-car-r3

          ADAPTER='https://cbknucemarcpbscirzyv.supabase.co/functions/v1/used-car-product-ready-adapter'
          STAFF='https://cbknucemarcpbscirzyv.supabase.co/functions/v1/used-car-staff-authority'
          LEGACY='https://dpro-used-car-line-api.dpromstk2000.workers.dev'
          APP='https://dpromstk2000-lab.github.io/dpro-used-car-line-liff'
          SITE='https://dpromstk2000-lab.github.io/dpro-line-systems-site'

          rc=0

          get_json() {
            url="$1"; out="$2"
            code="$(curl --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 -sS -L -o "$out" -w '%{http_code}' "$url")"
            echo "$code"
          }

          code="$(get_json "$ADAPTER/api/health?r3=$GITHUB_RUN_ID" /tmp/adapter-health.json)"
          [ "$code" = "200" ] || rc=1

          code="$(get_json "$ADAPTER/api/product-ready/check?r3=$GITHUB_RUN_ID" /tmp/product-ready.json)"
          [ "$code" = "200" ] || rc=1

          code="$(get_json "$STAFF/health?r3=$GITHUB_RUN_ID" /tmp/staff-health.json)"
          [ "$code" = "200" ] || rc=1

          code="$(get_json "$STAFF/self-test?r3=$GITHUB_RUN_ID" /tmp/staff-self-test.json)"
          [ "$code" = "200" ] || rc=1

          code="$(get_json "$LEGACY/api/health?r3=$GITHUB_RUN_ID" /tmp/legacy-health.json)"
          [ "$code" = "200" ] || rc=1

          python - <<'PY' || rc=1
          import json, pathlib

          def load(p):
              return json.loads(pathlib.Path(p).read_text(encoding='utf-8'))

          ah=load('/tmp/adapter-health.json')
          pr=load('/tmp/product-ready.json')
          sh=load('/tmp/staff-health.json')
          st=load('/tmp/staff-self-test.json')
          lg=load('/tmp/legacy-health.json')

          assert ah.get('ok') is True
          assert ah.get('adapter_version') == 'DPRO-CONTROL-ADAPTER-1.0-USED_CAR-R2-20260824'
          assert ah.get('frontend_version') == 'CAR-25-PRODUCT-READY-R2-20260824'
          assert ah.get('database_version') == 'CAR-DB-PRODUCT-READY-R2-20260824'
          assert ah.get('is_demo') is True
          assert ah.get('production_guard') is True

          assert pr.get('ok') is True
          assert pr.get('result',{}).get('all_passed') is True
          assert pr.get('result',{}).get('passed') == pr.get('result',{}).get('total')
          assert pr.get('adapter_version') == 'DPRO-CONTROL-ADAPTER-1.0-USED_CAR-R2-20260824'
          assert pr.get('frontend_version') == 'CAR-25-PRODUCT-READY-R2-20260824'
          assert pr.get('database_version') == 'CAR-DB-PRODUCT-READY-R2-20260824'
          assert pr.get('company',{}).get('is_demo') is True
          assert pr.get('company',{}).get('production_guard') is True
          assert all(pr.get('checks',{}).values())

          assert sh.get('ok') is True
          assert sh.get('version') == 'USED_CAR-STAFF-AUTHORITY-R2-20260824'
          assert st.get('ok') is True
          assert st.get('version') == 'USED_CAR-STAFF-AUTHORITY-R2-20260824'
          checks=st.get('checks',{})
          assert checks.get('individual_session') is True
          assert checks.get('capability') is True
          assert checks.get('revoke') is True
          assert checks.get('critical_audit') is True
          assert checks.get('cleanup') is True

          assert lg.get('ok') is not False
          expected='CAR-24-R3-WORKER-SYSTEM-CHECK-FAULT-TOLERANT-COMPLETE-20260725'
          observed=lg.get('version') or lg.get('service')
          assert observed == expected, observed

          print('RUNTIME_JSON=PASS')
          PY

          for f in adapter-health product-ready staff-health staff-self-test legacy-health; do
            if [ -f "/tmp/${f}.json" ]; then
              cp "/tmp/${f}.json" "product-ready-evidence/used-car-r3/${f}.json"
            fi
          done

          python - <<'PY' || rc=1
          import json, subprocess, pathlib, datetime

          urls=[
            ('index','https://dpromstk2000-lab.github.io/dpro-used-car-line-liff/index.html?demo=1'),
            ('member','https://dpromstk2000-lab.github.io/dpro-used-car-line-liff/member.html?demo=1&line_user_id=demo_car_line_001'),
            ('owner','https://dpromstk2000-lab.github.io/dpro-used-car-line-liff/owner.html?demo=1'),
            ('owner_ipad','https://dpromstk2000-lab.github.io/dpro-used-car-line-liff/owner-ipad.html?demo=1'),
            ('system_check','https://dpromstk2000-lab.github.io/dpro-used-car-line-liff/system-check.html?demo=1'),
            ('product_site','https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/used-car.html'),
            ('official_site','https://dpro-shop.com/systems/used-car'),
            ('lp','https://dpromstk2000-lab.github.io/dpro-line-systems-site/lp-car.html'),
            ('flyer_html','https://dpromstk2000-lab.github.io/dpro-line-systems-site/flyer-car.html'),
          ]

          result=[]
          for key,url in urls:
              out=f'/tmp/used-car-{key}.body'
              cp=subprocess.run(
                  ['curl','--retry','3','--retry-delay','2','--connect-timeout','15','--max-time','45',
                   '-sS','-L','-o',out,'-w','%{http_code}',url],
                  capture_output=True,text=True
              )
              code=int(cp.stdout.strip() or 0)
              size=pathlib.Path(out).stat().st_size if pathlib.Path(out).exists() else 0
              result.append({'key':key,'url':url,'httpStatus':code,'bytes':size,'ok':code==200 and size>200})

          ok=all(x['ok'] for x in result)
          pathlib.Path('product-ready-evidence/used-car-r3/public-http.json').write_text(
              json.dumps({
                  'ok':ok,
                  'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'results':result
              },ensure_ascii=False,indent=2)+'\n',
              encoding='utf-8'
          )
          if not ok:
              raise SystemExit(json.dumps(result,ensure_ascii=False,indent=2))
          print('PUBLIC_HTTP=PASS')
          PY


      - name: Persist PDF status
        shell: bash
        if: always()
        run: |
          # Re-check flyer in a tiny deterministic step so its HTTP status is preserved.
          code="$(curl --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 45 -sS -L \
            -o /tmp/flyer-car-2.pdf -w '%{http_code}' \
            "https://dpromstk2000-lab.github.io/dpro-line-systems-site/flyer-car.pdf?r3b=$GITHUB_RUN_ID" || true)"
          python - <<PY
          import json, pathlib, datetime
          code=int("${code}" or 0)
          p=pathlib.Path('/tmp/flyer-car-2.pdf')
          b=p.read_bytes() if p.exists() else b''
          out={
            'ok':code==200 and len(b)>10000 and b.startswith(b'%PDF-'),
            'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'url':'https://dpromstk2000-lab.github.io/dpro-line-systems-site/flyer-car.pdf',
            'httpStatus':code,'bytes':len(b),
            'pdfHeader':b[:5].decode('ascii','replace') if b else ''
          }
          pathlib.Path('product-ready-evidence/used-car-r3').mkdir(parents=True,exist_ok=True)
          pathlib.Path('product-ready-evidence/used-car-r3/flyer-http.json').write_text(json.dumps(out,indent=2)+'\n')
          if not out['ok']:
              raise SystemExit(json.dumps(out,indent=2))
          PY

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/used-car-r3
          cd /tmp/used-car-r3
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Fresh public Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/used-car-r3/screenshots

          cat > /tmp/used-car-r3/qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const BASE='https://dpromstk2000-lab.github.io/dpro-used-car-line-liff/';
          const cases=[
            {key:'pc1440-owner',file:'owner.html?demo=1',width:1440,height:1000},
            {key:'mobile390-index',file:'index.html?demo=1',width:390,height:844},
            {key:'mobile320-member',file:'member.html?demo=1&line_user_id=demo_car_line_001',width:320,height:720},
            {key:'ipad1024-owner',file:'owner-ipad.html?demo=1',width:1024,height:768},
            {key:'pc1440-system-check',file:'system-check.html?demo=1',width:1440,height:1000}
          ];

          const blockingConsole=/(ReferenceError|TypeError|SyntaxError|Uncaught|is not defined|Cannot read (properties|property)|Failed to execute)/i;
          const blockingText=/通信エラー|取得できませんでした|確認が必要な項目があります|ADAPTER_ERROR|ADMIN_AUTH|LINE_VERIFY|undefined/i;
          const secretText=/(SUPABASE_SERVICE_ROLE_KEY|service[_ -]?role[_ -]?key|channel[_ -]?secret|stack trace|ReferenceError:|TypeError:|SyntaxError:)/i;

          const browser=await chromium.launch({headless:true});
          const results=[];
          let failed=false;

          for(const c of cases){
            const ctx=await browser.newContext({viewport:{width:c.width,height:c.height},deviceScaleFactor:1});
            const page=await ctx.newPage();
            const pageErrors=[], consoleErrors=[], httpErrors=[];

            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
            page.on('response',r=>{
              if(r.status()>=400){
                httpErrors.push({status:r.status(),url:r.url(),resourceType:r.request().resourceType()});
              }
            });

            let status=0,navigationError='';
            try{
              const resp=await page.goto(
                BASE+c.file+(c.file.includes('?')?'&':'?')+'r3='+Date.now(),
                {waitUntil:'domcontentloaded',timeout:60000}
              );
              status=resp?.status()||0;
              await page.waitForTimeout(4500);
            }catch(e){
              navigationError=String(e);
            }

            const metrics=navigationError?null:await page.evaluate(()=>{
              const de=document.documentElement,b=document.body;
              return {
                innerWidth:window.innerWidth,
                scrollWidth:Math.max(de?.scrollWidth||0,b?.scrollWidth||0),
                text:(b?.innerText||'').slice(0,250000)
              };
            });

            const overflow=metrics ? metrics.scrollWidth>metrics.innerWidth+1 : true;
            const blockingConsoleErrors=consoleErrors.filter(x=>blockingConsole.test(x));
            const criticalResourceErrors=httpErrors.filter(x=>['document','script','stylesheet'].includes(x.resourceType));
            const technicalExposure=metrics ? secretText.test(metrics.text) : true;
            const blockingUserText=metrics ? blockingText.test(metrics.text) : true;

            const rec={
              ...c,url:BASE+c.file,httpStatus:status,navigationError,
              innerWidth:metrics?.innerWidth??0,scrollWidth:metrics?.scrollWidth??0,
              overflow,pageErrors,consoleErrors,blockingConsoleErrors,httpErrors,criticalResourceErrors,
              technicalExposure,blockingUserText
            };

            rec.ok=!navigationError && status===200 && !overflow &&
              pageErrors.length===0 && blockingConsoleErrors.length===0 &&
              criticalResourceErrors.length===0 && !technicalExposure && !blockingUserText;

            if(!rec.ok) failed=true;
            results.push(rec);

            if(!navigationError){
              await page.screenshot({
                path:`product-ready-evidence/used-car-r3/screenshots/${c.key}.png`,
                fullPage:true
              });
            }
            await ctx.close();
          }

          await browser.close();

          const summary={
            ok:!failed,
            checkedAt:new Date().toISOString(),
            sourceHead:process.env.SOURCE_HEAD||null,
            frontendVersion:'CAR-25-PRODUCT-READY-R2-20260824',
            adapterVersion:'DPRO-CONTROL-ADAPTER-1.0-USED_CAR-R2-20260824',
            databaseVersion:'CAR-DB-PRODUCT-READY-R2-20260824',
            legacyWorkerVersion:'CAR-24-R3-WORKER-SYSTEM-CHECK-FAULT-TOLERANT-COMPLETE-20260725',
            total:results.length,
            passed:results.filter(x=>x.ok).length,
            failed:results.filter(x=>!x.ok).length,
            results
          };

          fs.writeFileSync(
            'product-ready-evidence/used-car-r3/browser-final.json',
            JSON.stringify(summary,null,2)+'\n'
          );

          console.log(JSON.stringify({
            ok:summary.ok,total:summary.total,passed:summary.passed,failed:summary.failed,
            failedCases:results.filter(x=>!x.ok)
          },null,2));

          process.exit(summary.ok?0:2);
          EOF

          set +e
          node /tmp/used-car-r3/qa.mjs
          rc=$?
          set -e
          echo "QA_EXIT=$rc" >> "$GITHUB_ENV"

      - name: Build final evidence summary
        if: always()
        shell: python
        run: |
          import json, pathlib, datetime, os

          root=pathlib.Path('product-ready-evidence/used-car-r3')

          def read(name, default):
              p=root/name
              if not p.exists(): return default
              try: return json.loads(p.read_text(encoding='utf-8'))
              except Exception: return default

          browser=read('browser-final.json',{'ok':False})
          public=read('public-http.json',{'ok':False})
          flyer=read('flyer-http.json',{'ok':False})
          ah=read('adapter-health.json',{'ok':False})
          pr=read('product-ready.json',{'ok':False})
          sh=read('staff-health.json',{'ok':False})
          st=read('staff-self-test.json',{'ok':False})
          lg=read('legacy-health.json',{'ok':False})

          runtime_ok=(
              ah.get('ok') is True and
              pr.get('ok') is True and pr.get('result',{}).get('all_passed') is True and
              sh.get('ok') is True and st.get('ok') is True and
              lg.get('ok') is not False
          )

          out={
            'ok': bool(runtime_ok and public.get('ok') is True and flyer.get('ok') is True and browser.get('ok') is True),
            'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'sourceHead':os.getenv('SOURCE_HEAD'),
            'runtimeOk':runtime_ok,
            'publicHttpOk':public.get('ok') is True,
            'flyerOk':flyer.get('ok') is True,
            'browserOk':browser.get('ok') is True,
            'closesReadyItems':['READY-006','READY-018','READY-019','READY-020','READY-021','READY-023','READY-028'],
            'nonblockingAlsoRefreshed':['READY-032'],
            'centralFinalLockSelfConfirmed':False
          }

          root.mkdir(parents=True,exist_ok=True)
          (root/'network-final.json').write_text(json.dumps(out,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,indent=2))

      - name: Commit R3 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f product-ready-evidence/used-car-r3/network-final.json

          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"

          git add product-ready-evidence/used-car-r3

          if ! git diff --cached --quiet; then
            git commit -m "Publish USED_CAR R3 network evidence"
          fi

          git pull --rebase
          git push

      - name: PASS cleanup
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          d=json.load(open('product-ready-evidence/used-car-r3/network-final.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          PY

          git pull --rebase
          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"

          git rm -f .github/workflows/STEP-USED-CAR-PRODUCT-READY-R3-NETWORK-FINAL.yml
          git commit -m "Complete USED_CAR Product READY R3 network gate"
          git push
