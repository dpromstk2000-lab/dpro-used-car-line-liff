name: DPRO CAR STEP CAR-24 R1 Production Readiness

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/step-car-24-r1-production-readiness.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-car-step-car-24-r1
  cancel-in-progress: false

jobs:
  update-production-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify CAR-24 Worker and SQL
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          url="https://dpro-used-car-line-api.dpromstk2000.workers.dev/api/health"
          request=urllib.request.Request(
              url,
              headers={
                  "Accept":"application/json",
                  "User-Agent":"Mozilla/5.0",
                  "Origin":"https://dpromstk2000-lab.github.io",
              },
          )
          try:
              with urllib.request.urlopen(request,timeout=25) as response:
                  data=json.load(response)
          except urllib.error.HTTPError as error:
              if error.code==403:
                  print("::warning::GitHub ActionsからWorkerへの確認だけがHTTP 403でした。ブラウザ確認を前提に続行します。")
                  raise SystemExit(0)
              raise
          if data.get("version")!="CAR-24-R1-WORKER-PRODUCTION-READINESS-RELEASE-CODE-FIX-COMPLETE-20260724":
              raise SystemExit(f"WorkerがCAR-24ではありません: {data.get('version')}")
          checks=data.get("checks") or {}
          required=[
              "car24_production_readiness_schema",
              "owner_release_readiness_api_ready",
              "release_automatic_check_ready",
              "release_manual_signoff_ready",
              "release_blocker_guard_ready",
              "release_demo_guard_ready",
              "release_report_export_ready",
              "release_environment_auto_mutation_disabled",
              "admin_guard",
          ]
          failed=[key for key in required if checks.get(key) is not True]
          if failed:
              raise SystemExit(f"CAR-24 Worker/SQL確認失敗: {failed}")
          print("CAR-24 Worker/SQL: OK")
          PY

      - name: Apply CAR-24 frontend update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          OWNER=Path("owner.html")
          CONFIG=Path("config.js")
          SYSTEM=Path("system-check.html")

          for path in (OWNER,CONFIG,SYSTEM):
              if not path.exists():
                  raise SystemExit(f"{path.name} が見つかりません。")

          owner=OWNER.read_text(encoding="utf-8")
          config=CONFIG.read_text(encoding="utf-8")
          system=SYSTEM.read_text(encoding="utf-8")

          old="CAR-23-DATA-MIGRATION-CSV-IMPORT-EXPORT-20260724"
          new="CAR-24-PRODUCTION-READINESS-FINAL-QUALITY-GATE-20260724"

          if old not in owner or old not in config:
              raise SystemExit("CAR-23の現行フロントエンドを確認できません。")

          owner_css=json.loads('"\\n    /* DPRO CAR STEP CAR-24 PRODUCTION READINESS */\\n    .release-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}\\n    .release-kpi{padding:15px;border:1px solid var(--line);border-radius:15px;background:#fff}\\n    .release-kpi.good{border-color:#8fceb9;background:#effaf6}.release-kpi.danger{border-color:#dfa39b;background:#fff5f3}\\n    .release-kpi span{display:block;color:var(--muted);font-size:13px;font-weight:850}.release-kpi strong{display:block;font-size:27px}\\n    .release-layout{margin-top:15px;display:grid;grid-template-columns:1fr 1fr;gap:15px}\\n    .release-panel{padding:18px;border:1px solid var(--line);border-radius:17px;background:#fff}\\n    .release-panel.full{grid-column:1/-1}.release-panel h3{margin:0;font-size:21px}.release-panel>p{margin:3px 0 14px;color:var(--muted);font-size:13px}\\n    .release-check-list{display:grid;gap:8px}.release-check{padding:11px 12px;display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;border:1px solid var(--line);border-radius:11px;background:#fff}\\n    .release-check.pass{border-color:#9acdbb;background:#f1faf7}.release-check.block{border-color:#dfa9a2;background:#fff5f3}\\n    .release-check-icon{width:27px;height:27px;display:grid;place-items:center;border-radius:999px;background:var(--soft);font-weight:900}\\n    .release-check.pass .release-check-icon{background:#d9f0e8;color:#087052}.release-check.block .release-check-icon{background:#ffe0dc;color:#a33127}\\n    .release-check strong{display:block}.release-check span{display:block;color:var(--muted);font-size:12px}\\n    .release-manual{display:grid;gap:8px}.release-manual label{padding:11px 12px;display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:850}\\n    .release-manual input{width:21px;height:21px;margin-top:2px}.release-form-field{display:grid;gap:5px;margin-top:10px}.release-form-field label{font-size:13px;font-weight:900}\\n    .release-form-field input,.release-form-field textarea{width:100%;min-height:46px;padding:8px 10px;border:1px solid #b9c6d0;border-radius:10px}.release-form-field textarea{min-height:85px;resize:vertical}\\n    .release-actions{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}.release-actions .button{min-height:46px}\\n    .release-blockers{display:grid;gap:8px}.release-blocker{padding:11px 13px;border-left:5px solid var(--red);border-radius:0 10px 10px 0;background:var(--red2)}\\n    .release-warning{padding:11px 13px;border-left:5px solid var(--amber);border-radius:0 10px 10px 0;background:var(--amber2)}\\n    .release-environment{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.release-environment div{padding:10px;border-radius:10px;background:var(--soft)}\\n    .release-environment span{display:block;color:var(--muted);font-size:11px}.release-environment strong{display:block;overflow-wrap:anywhere}\\n    .release-safe{margin-top:14px;padding:14px;border-radius:12px;background:var(--navy);color:#fff}.release-safe strong{display:block}.release-safe span{display:block;color:#d2dfe8;font-size:13px}\\n    @media(max-width:1050px){.release-layout{grid-template-columns:1fr}.release-panel.full{grid-column:auto}}\\n    @media(max-width:700px){.release-kpis,.release-environment{grid-template-columns:1fr}}\\n"')
          owner_js=json.loads('"\\n    const CAR24_STATUS_LABEL={blocked:\\"未完了\\",ready:\\"準備完了\\",released:\\"本番準備完了記録済み\\"};\\n    let car24Data=null;\\n\\n    async function car24Load(){\\n      car24Data=await api(\\"/api/admin/release-readiness\\");\\n      makeNav(document.getElementById(\\"desktopNav\\"));\\n      makeNav(document.getElementById(\\"mobileNav\\"));\\n      return car24Data;\\n    }\\n\\n    function car24DownloadReport(){\\n      if(!car24Data)return;\\n      const report={\\n        generated_at:new Date().toISOString(),\\n        frontend_version:window.DPRO_CAR_CONFIG?.version||null,\\n        api_version:car24Data.version,\\n        summary:car24Data.summary,\\n        readiness:car24Data.readiness,\\n        safety:car24Data.safety\\n      };\\n      const blob=new Blob([JSON.stringify(report,null,2)],{type:\\"application/json;charset=utf-8\\"});\\n      const url=URL.createObjectURL(blob),anchor=document.createElement(\\"a\\");\\n      anchor.href=url;anchor.download=`dpro-car-release-readiness-${new Date().toISOString().slice(0,10)}.json`;\\n      document.body.append(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);\\n    }\\n\\n    function renderRelease(){\\n      const root=document.getElementById(\\"view-release\\");clear(root);\\n      root.append(sectionHeader(\\"本番準備・総合完成検査\\",\\"全STEPの安全性と導入準備を一括判定します\\",0));\\n      root.append(el(\\"div\\",\\"empty\\",\\"本番準備状況を取得しています。\\"));\\n      car24Load().then(()=>car24Render(root)).catch(error=>{clear(root);root.append(empty(error.message));showToast(error.message,true)});\\n    }\\n\\n    function car24Render(root){\\n      clear(root);\\n      const summary=car24Data?.summary||{},readiness=car24Data?.readiness||{},status=summary.status||\\"blocked\\";\\n      root.append(sectionHeader(\\"本番準備・総合完成検査\\",\\"環境を自動変更せず、阻害事項と手動確認を可視化します\\",summary.blocker_count||0));\\n      const kpis=el(\\"div\\",\\"release-kpis\\");\\n      [[\\"状態\\",CAR24_STATUS_LABEL[status]||status,status===\\"ready\\"||status===\\"released\\"?\\"good\\":\\"danger\\"],[\\"阻害事項\\",summary.blocker_count||0,summary.blocker_count?\\"danger\\":\\"good\\"],[\\"自動検査\\",`${summary.automatic_passed||0}/${summary.automatic_total||0}`,summary.automatic_passed===summary.automatic_total?\\"good\\":\\"\\"],[\\"手動確認\\",`${summary.manual_passed||0}/${summary.manual_total||0}`,summary.manual_passed===summary.manual_total?\\"good\\":\\"\\"]].forEach(([labelText,value,className])=>{const card=el(\\"article\\",`release-kpi ${className||\\"\\"}`);card.append(el(\\"span\\",\\"\\",labelText),el(\\"strong\\",\\"\\",String(value)));kpis.append(card)});\\n      root.append(kpis);\\n\\n      const layout=el(\\"div\\",\\"release-layout\\"),autoPanel=el(\\"section\\",\\"release-panel\\"),manualPanel=el(\\"section\\",\\"release-panel\\");\\n      autoPanel.append(el(\\"h3\\",\\"\\",\\"自動総合検査\\"),el(\\"p\\",\\"\\",\\"DB・ストレージ・スキーマ・セキュリティ・環境変数を確認\\"));\\n      const autoList=el(\\"div\\",\\"release-check-list\\");\\n      Object.entries(readiness.automatic_checks||{}).forEach(([key,value])=>{const row=el(\\"div\\",`release-check ${value?\\"pass\\":\\"block\\"}`);row.append(el(\\"span\\",\\"release-check-icon\\",value?\\"✓\\":\\"!\\"),el(\\"div\\",\\"\\",`${readiness.automatic_labels?.[key]||key}`));autoList.append(row)});\\n      autoPanel.append(autoList);\\n\\n      manualPanel.append(el(\\"h3\\",\\"\\",\\"本番導入時の手動確認\\"),el(\\"p\\",\\"\\",\\"実際のLINE・担当者・バックアップだけを確認\\"));\\n      const form=document.createElement(\\"form\\"),manualList=el(\\"div\\",\\"release-manual\\");\\n      const inputs={};\\n      Object.entries(readiness.manual_labels||{}).forEach(([key,labelText])=>{const label=document.createElement(\\"label\\"),input=document.createElement(\\"input\\");input.type=\\"checkbox\\";input.checked=readiness.manual_checks?.[key]===true;inputs[key]=input;label.append(input,document.createTextNode(labelText));manualList.append(label)});\\n      const by=document.createElement(\\"input\\");by.value=readiness.confirmed_by||\\"\\";by.placeholder=\\"確認担当者名\\";\\n      const notes=document.createElement(\\"textarea\\");notes.value=readiness.release_notes||\\"\\";notes.placeholder=\\"導入先固有の注意事項・引継ぎ内容\\";\\n      const field=(labelText,node)=>{const wrap=el(\\"div\\",\\"release-form-field\\");wrap.append(el(\\"label\\",\\"\\",labelText),node);return wrap};\\n      const save=el(\\"button\\",\\"button amber\\",\\"準備状況を保存\\");save.type=\\"submit\\";\\n      form.append(manualList,field(\\"確認担当者\\",by),field(\\"本番導入メモ\\",notes),save);\\n      form.addEventListener(\\"submit\\",async event=>{event.preventDefault();save.disabled=true;try{const manual_checks=Object.fromEntries(Object.entries(inputs).map(([key,input])=>[key,input.checked]));car24Data=await api(\\"/api/admin/release-readiness\\",{method:\\"PATCH\\",body:JSON.stringify({manual_checks,confirmed_by:by.value||null,release_notes:notes.value||null})});showToast(\\"本番準備状況を保存しました。\\");car24Render(document.getElementById(\\"view-release\\"))}catch(error){showToast(error.message,true)}finally{save.disabled=false}});\\n      manualPanel.append(form);\\n      layout.append(autoPanel,manualPanel);\\n\\n      const blockerPanel=el(\\"section\\",\\"release-panel full\\");blockerPanel.append(el(\\"h3\\",\\"\\",\\"阻害事項・注意事項\\"),el(\\"p\\",\\"\\",\\"0件になるまで本番準備完了は記録できません\\"));\\n      const blockerList=el(\\"div\\",\\"release-blockers\\");\\n      (readiness.blockers||[]).forEach(item=>blockerList.append(el(\\"div\\",\\"release-blocker\\",`${item.kind===\\"manual\\"?\\"手動確認\\":\\"自動検査\\"}：${item.label}`)));\\n      (readiness.warnings||[]).forEach(item=>blockerList.append(el(\\"div\\",\\"release-warning\\",item.label)));\\n      if(!blockerList.children.length)blockerList.append(el(\\"div\\",\\"release-check pass\\",\\"阻害事項はありません。\\"));\\n      blockerPanel.append(blockerList);\\n\\n      const environment=el(\\"div\\",\\"release-environment\\");environment.style.marginTop=\\"14px\\";\\n      [[\\"事業者\\",readiness.environment?.company_name],[\\"事業者コード\\",readiness.environment?.company_code],[\\"環境\\",readiness.environment?.is_demo?\\"デモ\\":\\"本番\\"],[\\"管理コード\\",readiness.environment?.admin_key_source],[\\"許可オリジン\\",readiness.environment?.allowed_origins_configured?\\"設定済み\\":\\"未設定\\"],[\\"Worker\\",readiness.environment?.worker_version]].forEach(([labelText,value])=>{const box=el(\\"div\\");box.append(el(\\"span\\",\\"\\",labelText),el(\\"strong\\",\\"\\",String(value??\\"未設定\\")));environment.append(box)});\\n      blockerPanel.append(environment);\\n\\n      const actions=el(\\"div\\",\\"release-actions\\");\\n      const verify=el(\\"button\\",\\"button\\",\\"総合検査を再実行\\");verify.type=\\"button\\";verify.addEventListener(\\"click\\",async()=>{verify.disabled=true;try{car24Data=await api(\\"/api/admin/release-readiness/verify\\",{method:\\"POST\\",body:\\"{}\\"});showToast(car24Data.message);car24Render(document.getElementById(\\"view-release\\"))}catch(error){showToast(error.message,true)}finally{verify.disabled=false}});\\n      const report=el(\\"button\\",\\"button\\",\\"検査レポートをダウンロード\\");report.type=\\"button\\";report.addEventListener(\\"click\\",car24DownloadReport);\\n      const release=el(\\"button\\",\\"button primary\\",\\"本番準備完了を記録\\");release.type=\\"button\\";release.disabled=Number(summary.blocker_count||0)>0||readiness.environment?.is_demo===true;release.addEventListener(\\"click\\",async()=>{if(!confirm(\\"全阻害事項が解消済みです。本番準備完了を記録しますか？\\"))return;release.disabled=true;try{const result=await api(\\"/api/admin/release-readiness/release\\",{method:\\"POST\\",body:JSON.stringify({confirmed:true})});showToast(result.message);await car24Load();car24Render(document.getElementById(\\"view-release\\"))}catch(error){showToast(error.message,true)}finally{release.disabled=false}});\\n      actions.append(verify,report,release);blockerPanel.append(actions);\\n      const safe=el(\\"div\\",\\"release-safe\\");safe.append(el(\\"strong\\",\\"\\",\\"本番環境を自動変更しません\\"),el(\\"span\\",\\"\\",\\"許可オリジン・LIFF・管理コード・デモ解除は、内容を確認して人が設定します。\\"));blockerPanel.append(safe);\\n      layout.append(blockerPanel);root.append(layout);\\n    }\\n"')

          if "DPRO CAR STEP CAR-24 PRODUCTION READINESS" not in owner:
              owner=owner.replace("</style>",owner_css+"\n  </style>",1)

          migration_view='        <section class="section-view" id="view-migration" hidden></section>'
          if 'id="view-release"' not in owner:
              if owner.count(migration_view)!=1:
                  raise SystemExit("本番準備画面の追加位置を確認できません。")
              owner=owner.replace(
                  migration_view,
                  migration_view+'\n        <section class="section-view" id="view-release" hidden></section>',
                  1,
              )

          migration_section='      {id:"migration",icon:"移",label:"データ移行",kicker:"CSV DATA MIGRATION",title:"顧客・車両・在庫CSV移行",description:"CSVを事前検査し、重複処理を確認してから安全に取り込みます。",count:()=>car23Data?.jobs?.length||0},'
          release_section=migration_section+'\n      {id:"release",icon:"完",label:"本番準備",kicker:"PRODUCTION READINESS",title:"総合完成検査・本番導入準備",description:"全STEPの安全性・環境設定・導入準備を一括判定します。",count:()=>car24Data?.summary?.blocker_count||0},'
          if 'id:"release"' not in owner:
              if owner.count(migration_section)!=1:
                  raise SystemExit("本番準備メニューの追加位置を確認できません。")
              owner=owner.replace(
                  migration_section,
                  release_section,
                  1,
              )

          renderer='financials:renderFinancials,migration:renderMigration,team:renderTeam'
          if 'release:renderRelease' not in owner:
              if owner.count(renderer)!=1:
                  raise SystemExit("本番準備レンダラーの追加位置を確認できません。")
              owner=owner.replace(
                  renderer,
                  'financials:renderFinancials,migration:renderMigration,release:renderRelease,team:renderTeam',
                  1,
              )

          if "const CAR24_STATUS_LABEL=" not in owner:
              marker='    function renderTeam(){'
              if owner.count(marker)!=1:
                  raise SystemExit("CAR-24 JavaScript追加位置を確認できません。")
              owner=owner.replace(marker,owner_js+"\n"+marker,1)

          owner=owner.replace(old,new)
          owner=owner.replace(
              "<title>オーナーPC管理 CAR-23｜DPRO中古車センター</title>",
              "<title>オーナーPC管理 CAR-24｜DPRO中古車センター</title>",
              1,
          )
          owner=owner.replace(
              "買取からデータ移行まで、一元管理。",
              "買取から本番準備まで、一元管理。",
              1,
          )
          owner=owner.replace(
              "査定・在庫・契約・帳票・既存データ移行を同じ画面で管理します。",
              "査定・在庫・契約・帳票・データ移行・本番準備を同じ画面で管理します。",
              1,
          )

          config=config.replace(
              " * STEP CAR-23 顧客・車両・在庫CSV移行・重複検査・取込履歴",
              " * STEP CAR-24 総合完成検査・本番導入前仕上げ・リリース判定",
              1,
          )
          config=re.sub(
              r'version:\s*"[^"]+"',
              f'version: "{new}"',
              config,
              count=1,
          )
          config=config.replace(
              "  dataMigrationAutomaticCommit: false,",
              "  dataMigrationAutomaticCommit: false,\n  ownerProductionReadiness: true,\n  releaseAutomaticQualityGate: true,\n  releaseManualSignoff: true,\n  releaseDemoGuard: true,\n  releaseEnvironmentAutoMutation: false,",
              1,
          )

          system=system.replace(
              "<title>システム確認 CAR-23｜DPRO中古車センター</title>",
              "<title>システム確認 CAR-24｜DPRO中古車センター</title>",
              1,
          )
          system=system.replace(
              "CAR-23 営業前システム確認",
              "CAR-24 営業前システム確認",
              1,
          )
          system=system.replace(
              "CAR-23 顧客・車両・在庫CSV移行・重複検査・取込履歴",
              "CAR-24 総合完成検査・本番導入前仕上げ・リリース判定",
              1,
          )

          label_marker='data_migration_export:"CSV書出し",admin_guard:'
          if "car24_production_readiness_schema" not in system:
              if system.count(label_marker)!=1:
                  raise SystemExit("system-check CAR-24ラベル追加位置を確認できません。")
              system=system.replace(
                  label_marker,
                  'data_migration_export:"CSV書出し",car24_production_readiness_schema:"CAR-24安全DB",owner_release_readiness:"本番準備API",release_automatic_quality_gate:"自動総合検査",release_manual_signoff:"手動確認",release_blocker_guard:"阻害事項ガード",release_demo_guard:"デモ本番化防止",release_report_export:"検査レポート",admin_guard:',
                  1,
              )

          count_marker='data_import_rows:"CSV検査行",open_tasks:"未完了タスク"'
          if 'release_readiness:"本番準備判定"' not in system:
              if system.count(count_marker)!=1:
                  raise SystemExit("system-check CAR-24件数追加位置を確認できません。")
              system=system.replace(
                  count_marker,
                  'data_import_rows:"CSV検査行",release_readiness:"本番準備判定",open_tasks:"未完了タスク"',
                  1,
              )

          required_owner=[
              new,
              'id="view-release"',
              'id:"release"',
              "renderRelease",
              "本番準備・総合完成検査",
              "本番環境を自動変更しません",
          ]
          missing=[marker for marker in required_owner if marker not in owner]
          if missing:
              raise SystemExit(f"owner.html検査失敗: {missing}")

          required_config=[
              new,
              "ownerProductionReadiness",
              "releaseAutomaticQualityGate",
              "releaseEnvironmentAutoMutation: false",
          ]
          missing=[marker for marker in required_config if marker not in config]
          if missing:
              raise SystemExit(f"config.js検査失敗: {missing}")

          if "car24_production_readiness_schema" not in system:
              raise SystemExit("system-check.html検査失敗")

          OWNER.write_text(owner,encoding="utf-8")
          CONFIG.write_text(config,encoding="utf-8")
          SYSTEM.write_text(system,encoding="utf-8")
          print("CAR-24 frontend update: OK")
          PY

      - name: Validate CAR-24 frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          requirements={
            "owner.html":[
              "CAR-24-PRODUCTION-READINESS-FINAL-QUALITY-GATE-20260724",
              "view-release",
              "renderRelease",
              "本番準備・総合完成検査",
              "検査レポートをダウンロード",
              "本番環境を自動変更しません",
            ],
            "config.js":[
              "CAR-24-PRODUCTION-READINESS-FINAL-QUALITY-GATE-20260724",
              "ownerProductionReadiness",
              "releaseManualSignoff",
              "releaseEnvironmentAutoMutation: false",
            ],
            "system-check.html":[
              "CAR-24",
              "car24_production_readiness_schema",
              "release_blocker_guard",
              "release_readiness",
            ],
          }
          for filename,markers in requirements.items():
              text=Path(filename).read_text(encoding="utf-8")
              missing=[marker for marker in markers if marker not in text]
              if missing:
                  raise SystemExit(f"{filename}検査失敗: {missing}")

          owner=Path("owner.html").read_text(encoding="utf-8")
          scripts=[
            value for value in re.findall(
              r"<script(?:\s+[^>]*)?>(.*?)</script>",
              owner,
              flags=re.S,
            )
            if value.strip()
          ]
          if not scripts:
              raise SystemExit("owner.html JavaScript抽出失敗")
          Path("/tmp/car24-owner.js").write_text(
              scripts[-1],
              encoding="utf-8",
          )

          ids=re.findall(r'\bid="([^"]+)"',owner)
          duplicates=sorted({value for value in ids if ids.count(value)>1})
          if duplicates:
              raise SystemExit(f"owner.html重複ID: {duplicates}")

          print("CAR-24 frontend validation: OK")
          PY
          node --check /tmp/car24-owner.js
          node --check config.js

      - name: Normalize and inspect
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in ("owner.html","config.js","system-check.html"):
              path=Path(filename)
              text=path.read_text(encoding="utf-8")
              path.write_text(
                  "\n".join(
                      line.rstrip(" \t")
                      for line in text.splitlines()
                  )+"\n",
                  encoding="utf-8",
              )
          PY
          git diff --check
          git status --short
          git diff --stat

      - name: Commit CAR-24 and remove temporary workflow
        shell: bash
        run: |
          git config user.name "DPRO CAR Automation"
          git config user.email "actions@users.noreply.github.com"
          git add owner.html config.js system-check.html
          git rm --ignore-unmatch .github/workflows/step-car-24-production-readiness.yml
          git rm --ignore-unmatch .github/workflows/step-car-24-r1-production-readiness.yml
          if git diff --cached --quiet; then
            echo "コミット対象の変更はありません。"
            exit 0
          fi
          git commit -m "CAR-24-R1: add production readiness quality gate"
          git push origin main
