name: CAR Tutorial R4 Guide Center LIVE QA

on:
  push:
    branches: [main]
    paths:
      - demo-guide.html
      - tutorial.js
      - tutorial.css
      - .github/workflows/tutorial-r4-live-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: car-tutorial-r4-live-qa
  cancel-in-progress: false

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Static R4 contract checks
        shell: bash
        run: |
          set -euo pipefail
          node --check tutorial.js
          grep -q 'DPRO CAR GUIDE CENTER / R4 V1.0 / 20260829' demo-guide.html
          grep -q 'DPRO_CAR_TUTORIAL' demo-guide.html
          grep -q 'data-guide-action="start"' demo-guide.html
          grep -q 'data-guide-action="resume"' demo-guide.html
          grep -q 'data-guide-action="replay"' demo-guide.html
          grep -q 'data-guide-go=' demo-guide.html
          grep -q 'R3 MOBILE FORCED INSTANT SCROLL + RETRY PATCH V1.4 / 20260829' tutorial.js
          test "$(grep -c 'id:\"CAR-' tutorial.js)" -eq 10
          ! grep -q 'localStorage.setItem' demo-guide.html
          ! grep -q 'sessionStorage.setItem' demo-guide.html

      - name: Wait for exact public GitHub Pages assets
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://dpromstk2000-lab.github.io/dpro-used-car-line-liff'
          LOCAL_GUIDE_SHA="$(sha256sum demo-guide.html | awk '{print $1}')"
          LOCAL_JS_SHA="$(sha256sum tutorial.js | awk '{print $1}')"
          LOCAL_CSS_SHA="$(sha256sum tutorial.css | awk '{print $1}')"
          ok=0
          for i in $(seq 1 72); do
            q="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${i}"
            if curl -fsS "$BASE/demo-guide.html?demo=1&qa=$q" -o /tmp/car-guide.html \
              && curl -fsS "$BASE/tutorial.js?qa=$q" -o /tmp/car-tutorial.js \
              && curl -fsS "$BASE/tutorial.css?qa=$q" -o /tmp/car-tutorial.css; then
              REMOTE_GUIDE_SHA="$(sha256sum /tmp/car-guide.html | awk '{print $1}')"
              REMOTE_JS_SHA="$(sha256sum /tmp/car-tutorial.js | awk '{print $1}')"
              REMOTE_CSS_SHA="$(sha256sum /tmp/car-tutorial.css | awk '{print $1}')"
              if [ "$REMOTE_GUIDE_SHA" = "$LOCAL_GUIDE_SHA" ] \
                && [ "$REMOTE_JS_SHA" = "$LOCAL_JS_SHA" ] \
                && [ "$REMOTE_CSS_SHA" = "$LOCAL_CSS_SHA" ]; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" -eq 1

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Run exact four-width R4 LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          cat > car-tutorial-r4-live-qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const BASE='https://dpromstk2000-lab.github.io/dpro-used-car-line-liff';
          const widths=[
            {name:'1440x1000',width:1440,height:1000},
            {name:'1024x768',width:1024,height:768},
            {name:'390x844',width:390,height:844},
            {name:'320x720',width:320,height:720}
          ];
          const expectedIds=Array.from({length:10},(_,i)=>`CAR-${String(i+1).padStart(2,'0')}`);
          const assert=(condition,message)=>{if(!condition)throw new Error(message)};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const results=[];

          async function waitGuide(page){
            await page.waitForFunction(() =>
              Boolean(window.DPRO_CAR_TUTORIAL) &&
              document.querySelectorAll('#guideGrid .guide-item').length===10
            ,{timeout:15000});
          }
          async function waitStep(page,n,route){
            await page.waitForFunction(({n,route})=>{
              const api=window.DPRO_CAR_TUTORIAL;if(!api)return false;
              const file=location.pathname.split('/').filter(Boolean).pop()||'index.html';
              const normalized=file.includes('.')?file:'index.html';
              return api.getState().step===n &&
                normalized===route &&
                !document.querySelector('#dproTutorialCard')?.hidden;
            },{n,route},{timeout:15000});
            await sleep(120);
          }
          async function gotoGuide(page){
            await page.goto(`${BASE}/demo-guide.html?demo=1&qa=${Date.now()}`,{waitUntil:'domcontentloaded'});
            await waitGuide(page);
          }

          const browser=await chromium.launch({headless:true});
          for(const v of widths){
            const context=await browser.newContext({viewport:{width:v.width,height:v.height},hasTouch:v.width<=390,isMobile:false});
            const page=await context.newPage();
            const unsafe=[]; const pageErrors=[]; const consoleErrors=[];
            page.on('request',r=>{if(!['GET','HEAD','OPTIONS'].includes(r.method()))unsafe.push(`${r.method()} ${r.url()}`)});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});

            await gotoGuide(page);
            await page.evaluate(()=>localStorage.removeItem(window.DPRO_CAR_TUTORIAL.key));
            await page.reload({waitUntil:'domcontentloaded'});
            await waitGuide(page);

            const alignment=await page.evaluate(()=>{
              const api=window.DPRO_CAR_TUTORIAL;
              return [...document.querySelectorAll('#guideGrid .guide-item')].map((el,i)=>({
                id:el.dataset.stepId,
                route:el.dataset.route,
                primary:el.dataset.primary,
                fallback:el.dataset.fallback,
                api:api.steps[i]
              }));
            });
            assert(alignment.length===10,`${v.name}: GUIDE_COUNT`);
            assert(JSON.stringify(alignment.map(x=>x.id))===JSON.stringify(expectedIds),`${v.name}: guide ids/order`);
            for(const row of alignment){
              assert(row.id===row.api.id,`${v.name}: id mismatch ${row.id}`);
              assert(row.route===row.api.route,`${v.name}: route mismatch ${row.id}`);
              assert(row.primary===row.api.primary,`${v.name}: primary mismatch ${row.id}`);
              assert(row.fallback===(row.api.fallback||''),`${v.name}: fallback mismatch ${row.id}`);
            }

            const original=await page.evaluate(()=>({
              screenCards:document.querySelectorAll('#screenGrid .card').length,
              journey:document.querySelectorAll('#flowGrid .flow-step').length,
              official:document.querySelector('#officialLink')?.getAttribute('href')||'',
              primary:document.querySelector('#primaryDemoLink')?.getAttribute('href')||''
            }));
            assert(original.screenCards===4 && original.journey===5,`${v.name}: product regression counts`);
            assert(original.official.includes('/dpro-line-systems-site/lp-car.html'),`${v.name}: official regression`);
            assert(original.primary.includes('/dpro-used-car-line-liff/sell.html?demo=1'),`${v.name}: primary regression`);

            await page.locator('[data-guide-action="start"]').focus();
            const outline=await page.evaluate(()=>getComputedStyle(document.activeElement).outlineStyle);
            assert(outline!=='none',`${v.name}: guide focus-visible`);
            await page.keyboard.press('Enter');
            await page.waitForURL(/dpro-used-car-line-liff\/(?:index\.html)?\?/,{timeout:15000});
            await waitStep(page,1,'index.html');

            await gotoGuide(page);
            await page.locator('[data-guide-go="7"]').click();
            await page.waitForURL(/inventory\.html\?/,{timeout:15000});
            await waitStep(page,7,'inventory.html');
            await page.locator('#dproTutorialClose').click();
            const paused=await page.evaluate(()=>window.DPRO_CAR_TUTORIAL.getState());
            assert(paused.step===7 && paused.status==='paused',`${v.name}: paused state`);

            await gotoGuide(page);
            assert(await page.locator('[data-guide-action="resume"]').isVisible(),`${v.name}: resume hidden`);
            await page.locator('[data-guide-action="resume"]').click();
            await page.waitForURL(/inventory\.html\?/,{timeout:15000});
            await waitStep(page,7,'inventory.html');

            await page.locator('#dproTutorialSkip').click();
            const done=await page.evaluate(()=>window.DPRO_CAR_TUTORIAL.getState());
            assert(done.status==='completed',`${v.name}: skip completion`);

            await gotoGuide(page);
            await page.locator('[data-guide-action="replay"]').click();
            await page.waitForURL(/dpro-used-car-line-liff\/(?:index\.html)?\?/,{timeout:15000});
            await waitStep(page,1,'index.html');

            await gotoGuide(page);
            await page.locator('[data-guide-go="8"]').focus();
            await page.keyboard.press('Enter');
            await page.waitForURL(/inventory\.html\?/,{timeout:15000});
            await waitStep(page,8,'inventory.html');

            await gotoGuide(page);
            const storage=await page.evaluate(()=>{
              const key=window.DPRO_CAR_TUTORIAL.key;
              return {key,keys:Object.keys(localStorage).filter(k=>k===key)};
            });
            assert(storage.keys.length===1 && storage.keys[0]===storage.key,`${v.name}: second tutorial storage detected`);

            const overflow=await page.evaluate(()=>({
              innerWidth,
              doc:document.documentElement.scrollWidth,
              body:document.body.scrollWidth
            }));
            if(v.width<=390){
              assert(overflow.doc<=overflow.innerWidth && overflow.body<=overflow.innerWidth,`${v.name}: overflow ${JSON.stringify(overflow)}`);
            }

            assert(unsafe.length===0,`${v.name}: unsafe write ${JSON.stringify(unsafe)}`);
            assert(pageErrors.length===0,`${v.name}: pageerror ${JSON.stringify(pageErrors)}`);
            assert(consoleErrors.length===0,`${v.name}: console ${JSON.stringify(consoleErrors)}`);

            results.push({
              viewport:v.name,
              GUIDE_COUNT:10,
              contract_alignment:'PASS',
              start:'PASS',
              resume:'PASS',
              replay:'PASS',
              guide_step_launch:'PASS',
              keyboard_focus:'PASS',
              cross_page_resume:'PASS',
              same_state_storage:'PASS',
              overflow:v.width<=390?'0':'N/A',
              pageerror:0,
              console_error:0,
              unsafe_write_request:0,
              business_mutation:0,
              product_regression:0
            });
            await context.close();
          }
          await browser.close();

          const report={
            version:'DPRO-CAR-GUIDE-CENTER-R4-V1.0-20260829',
            R3_DEPENDENCY:'PASS',
            FIRST10_COUNT:10,
            GUIDE_COUNT:10,
            viewports:results,
            R4:'PASS',
            BUSINESS_MUTATION:0,
            PRODUCT_REGRESSION:0,
            generated_at:new Date().toISOString()
          };
          fs.writeFileSync('car-tutorial-r4-live-qa.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          NODE
          node car-tutorial-r4-live-qa.mjs

      - name: Upload R4 QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: car-tutorial-r4-live-qa
          path: car-tutorial-r4-live-qa.json
          if-no-files-found: error
