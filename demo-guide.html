<!doctype html>
<!-- DPRO LIVE DEMO COMMON TEMPLATE V1.0 LOCK / CONFIGURABLE TEMPLATE -->
<!-- DPRO CAR GUIDE CENTER / R4 V1.0 / 20260829 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title id="pageTitle">DPRO 公開操作デモ・画面一覧</title>
<link rel="stylesheet" href="tutorial.css" data-dpro-tutorial-asset="css">
<style>
:root{
  --bg:#f4f2ed;--card:#fff;--ink:#102033;--muted:#617083;--line:#d5dee5;
  --brand:#173858;--deep:#091522;--brand2:#e5a12b;--soft:#fff3dc;
  --shadow:0 16px 46px rgba(9,21,34,.10)
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;line-height:1.65;background:linear-gradient(180deg,#fff 0%,var(--bg) 100%)}
a{color:inherit}.page{width:min(1140px,calc(100% - 24px));margin:0 auto;padding:20px 0 48px}
.hero{position:relative;overflow:hidden;padding:34px;border-radius:28px;color:#fff;background:linear-gradient(135deg,var(--deep),var(--brand) 63%,var(--brand2));box-shadow:0 23px 58px rgba(35,30,27,.20)}
.hero:after{content:"";position:absolute;right:-95px;bottom:-150px;width:290px;height:290px;border-radius:50%;background:rgba(255,255,255,.07)}
.kicker{position:relative;z-index:1;font-size:11px;font-weight:1000;letter-spacing:.14em;opacity:.9}
.hero h1{position:relative;z-index:1;margin:10px 0 0;font-size:clamp(28px,5vw,49px);line-height:1.24}
.hero p{position:relative;z-index:1;max-width:830px;margin:13px 0 0;font-size:14px;opacity:.93}
.hero-actions{position:relative;z-index:1;display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
.button{min-height:45px;display:inline-flex;align-items:center;justify-content:center;padding:9px 15px;border-radius:999px;text-decoration:none;font-size:12px;font-weight:950}
.button-light{color:var(--deep);background:#fff}.button-ghost{color:#fff;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.09)}
.notice{margin-top:15px;padding:15px 17px;border:1px solid #e5cda3;border-radius:15px;background:#fff5e5;color:#725013;font-size:12px;font-weight:760}
.demo-info{margin-top:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.demo-info>div{padding:14px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.96);box-shadow:var(--shadow)}
.demo-info small{display:block;color:var(--brand);font-size:9px;font-weight:1000;letter-spacing:.08em}.demo-info strong{display:block;margin-top:4px;font-size:14px}
.section-head{margin:32px 0 15px}.section-head small{color:var(--brand);font-size:10px;font-weight:1000;letter-spacing:.12em}.section-head h2{margin:5px 0 0;font-size:clamp(23px,4vw,34px)}.section-head p{max-width:840px;margin:7px 0 0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{min-width:0;padding:20px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.98);box-shadow:var(--shadow)}
.card-number{color:var(--brand);font-size:10px;font-weight:1000;letter-spacing:.1em}.card h3{margin:7px 0 0;font-size:21px;line-height:1.4}.card p{margin:8px 0 0;color:var(--muted);font-size:12px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.pills span{padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--deep);font-size:9px;font-weight:900}
.card-note{margin-top:13px;padding:11px;border-radius:12px;background:var(--soft);color:#675a54;font-size:11px}.card-note b{color:var(--deep)}
.card-actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:15px}
.open,.official{min-height:44px;display:flex;align-items:center;justify-content:center;padding:9px 13px;border-radius:12px;text-decoration:none;font-size:10px;font-weight:950}
.open{color:#fff;background:linear-gradient(135deg,var(--deep),var(--brand2))}.official{color:var(--deep);border:1px solid var(--line);background:var(--soft)}
.flow{margin-top:14px;padding:19px;border:1px solid var(--line);border-radius:19px;background:#fff;box-shadow:var(--shadow)}
.flow-grid{display:grid;grid-template-columns:repeat(var(--flow-cols,5),minmax(0,1fr));gap:8px}
.flow-step{padding:12px;border-radius:12px;background:var(--soft)}.flow-step b{display:block;color:var(--brand);font-size:10px}.flow-step strong{display:block;margin-top:4px;font-size:11px}.flow-step.same{border:1px dashed #cdbfb6}
.footer{margin-top:26px;color:#82736c;font-size:10px;text-align:center}

/* R4 Guide Center */
.guide-shell{margin-top:14px;padding:20px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:var(--shadow)}
.guide-toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}
.guide-action{min-height:44px;border:1px solid var(--line);border-radius:999px;padding:9px 15px;background:#fff;color:var(--deep);font:inherit;font-size:12px;font-weight:950;cursor:pointer}
.guide-action.primary{border-color:transparent;color:#fff;background:linear-gradient(135deg,var(--deep),var(--brand2))}
.guide-action[hidden]{display:none!important}
.guide-status{margin-left:auto;min-height:44px;display:flex;align-items:center;padding:8px 12px;border-radius:12px;background:var(--soft);color:#675013;font-size:11px;font-weight:850}
.guide-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.guide-item{min-width:0;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}
.guide-item .guide-id{color:var(--brand);font-size:10px;font-weight:1000;letter-spacing:.08em}
.guide-item h3{margin:6px 0 0;font-size:18px;line-height:1.4}
.guide-item p{margin:7px 0 0;color:var(--muted);font-size:11px}
.guide-meta{margin-top:10px;display:grid;gap:5px}
.guide-meta code{display:block;max-width:100%;overflow-wrap:anywhere;padding:6px 8px;border-radius:9px;background:#f7f8f9;color:#334154;font-size:9px;line-height:1.45}
.guide-open{width:100%;min-height:44px;margin-top:11px;border:0;border-radius:11px;background:var(--deep);color:#fff;font:inherit;font-size:11px;font-weight:950;cursor:pointer}
.guide-action:focus-visible,.guide-open:focus-visible{outline:4px solid rgba(229,161,43,.48);outline-offset:3px}

@media(max-width:900px){.flow-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.hero{padding:25px 20px}.demo-info,.grid,.flow-grid,.guide-grid{grid-template-columns:1fr}.guide-status{width:100%;margin-left:0}}
@media(max-width:420px){.page{width:min(100% - 16px,1140px)}.card-actions{grid-template-columns:1fr}.guide-shell{padding:14px}.guide-toolbar{display:grid;grid-template-columns:1fr}.guide-action{width:100%}}
</style>
<script src="tutorial.js" defer data-dpro-tutorial-asset="js"></script>
</head>
<body>
<main class="page">
<section class="hero">
  <div class="kicker">DPRO 中古車 / 公開操作デモ</div>
  <h1 id="heroTitle"></h1>
  <p id="heroCopy"></p>
  <div class="hero-actions">
    <a class="button button-light" id="officialLink">公式の機能・料金説明を見る</a>
    <a class="button button-ghost" id="primaryDemoLink">まず体験する</a>
  </div>
</section>

<div class="notice" id="notice"></div>

<section class="demo-info" id="quickInfo" aria-label="デモ利用情報"></section>

<div class="section-head">
  <small>画面を選ぶ</small>
  <h2>確認する画面を選択</h2>
  <p id="screenIntro"></p>
</div>

<section class="grid" id="screenGrid"></section>

<div class="section-head">
  <small>おすすめの確認順</small>
  <h2>おすすめの確認順</h2>
  <p id="journeyIntro"></p>
</div>
<section class="flow"><div class="flow-grid" id="flowGrid"></div></section>

<div class="section-head">
  <small>操作ガイド</small>
  <h2>操作ガイド 10ステップ</h2>
  <p>操作ガイドの10項目を、最初から・続きから・もう一度見る、の操作で確認できます。</p>
</div>
<section class="guide-shell" id="guideCenter" aria-label="DPRO CAR 操作ガイド">
  <div class="guide-toolbar" id="guideToolbar">
    <button class="guide-action primary" type="button" data-guide-action="start">最初から開始</button>
    <button class="guide-action" type="button" data-guide-action="resume" hidden>続きから再開</button>
    <button class="guide-action" type="button" data-guide-action="replay">もう一度見る</button>
    <div class="guide-status" id="guideStatus" role="status" aria-live="polite">操作ガイドを読み込み中…</div>
  </div>
  <div class="guide-grid" id="guideGrid"></div>
</section>

<div class="footer" id="footer"></div>
</main>

<script>
/*
  DPRO LIVE DEMO COMMON TEMPLATE V1.0
  ------------------------------------------------------------
  既存のCHOOSE A SCREEN / RECOMMENDED JOURNEYを維持。
  R4 Guide Centerは既存セクションの後に追加し、R3 Tutorial APIを再利用する。
*/
const CONFIG = {
  "systemName": "DPRO CAR LINE",
  "pageTitle": "DPRO 中古車買取・販売｜公開操作デモ・画面一覧",
  "heroCopy": "買取・下取り査定で受けた車を販売在庫へつなぎ、商談・契約・納車、その後の点検・車検フォローまで。車両と顧客の履歴が切れない一連の流れを、実際の画面で確認できます。",
  "officialUrl": "https://dpromstk2000-lab.github.io/dpro-line-systems-site/lp-car.html",
  "primaryDemoUrl": "https://dpromstk2000-lab.github.io/dpro-used-car-line-liff/sell.html?demo=1",
  "notice": "公開デモでは実在する氏名・電話番号・車両登録番号・車台番号・写真等を入力せず、必ず架空の内容を使用してください。写真査定では実在車両の写真をアップロードしないでください。管理系画面は demo=1 の営業デモで、デモ用の認証情報が自動設定されます。",
  "screenIntro": "最初に01の買取・下取り／写真査定を確認し、公開在庫→現場の査定・商品化・商談→契約・納車・アフターの順に進むと、買取車を販売・納車後まで同じ車両と顧客の流れで扱う価値を確認できます。",
  "journeyIntro": "買取・下取りで受けた車が商品化され、販売・契約・納車・点検／車検フォローへつながる順番で確認します。",
  "adminCode": "1234",
  "quickInfo": [
    {"label":"お客様の流れ","text":"01 査定受付 → 02 公開在庫・試乗 → 03 査定・商品化・商談 → 04–05 契約・納車・アフター"},
    {"label":"デモについて","text":"管理系は demo=1 でデモ用の認証情報を自動設定します。公開デモは架空の顧客・車両情報のみ使用します。"},
    {"label":"画面構成","text":"既存の実画面4つで5工程を確認。04–05は同じオーナーPC画面"}
  ],
  "screens": [
    {
      "step":"01 / お客様 / はじめに",
      "title":"買取・下取り・写真概算査定",
      "description":"店頭査定・出張査定・写真概算査定から選び、車両情報・希望日時・写真を含む査定受付の流れを確認できます。",
      "tags":["買取査定","下取り査定","写真概算査定"],
      "note":"最初にここを確認します。氏名・電話番号・登録番号・写真は必ず架空の内容を使用し、実在車両の写真は送らないでください。",
      "url":"https://dpromstk2000-lab.github.io/dpro-used-car-line-liff/sell.html?demo=1",
      "cta":"査定受付を体験する",
      "officialUrl":"https://dpromstk2000-lab.github.io/dpro-line-systems-site/lp-car.html"
    },
    {
      "step":"02 / お客様 / 公開在庫",
      "title":"公開在庫・車両詳細・試乗相談",
      "description":"販売在庫を支払総額・年式・走行距離・装備で比較し、車両詳細や試乗相談へ進む公開側の流れを確認できます。",
      "tags":["販売在庫","車両詳細","試乗相談"],
      "note":"公開在庫の確認用です。デモ車両だけを使用してください。",
      "url":"https://dpromstk2000-lab.github.io/dpro-used-car-line-liff/inventory.html?demo=1",
      "cta":"販売在庫を見る",
      "officialUrl":"https://dpromstk2000-lab.github.io/dpro-line-systems-site/lp-car.html"
    },
    {
      "step":"03 / スタッフiPad / 現場管理",
      "title":"査定→商品化・商談の現場管理",
      "description":"来店、査定、商談、必要書類、在庫準備・商品化を、現場用の大きな操作で進める流れを確認できます。",
      "tags":["来店・査定","商談","商品化"],
      "note":"demo=1 ではデモ用の認証情報が自動設定されます。架空の営業データだけを操作してください。",
      "url":"https://dpromstk2000-lab.github.io/dpro-used-car-line-liff/owner-ipad.html?demo=1",
      "cta":"iPad現場管理を開く",
      "officialUrl":"https://dpromstk2000-lab.github.io/dpro-line-systems-site/lp-car.html"
    },
    {
      "step":"04–05 / オーナーPC / 同じ画面",
      "title":"契約・納車・アフターフォロー",
      "description":"販売契約・入金・必要書類・登録・納車準備から、納車完了後の点検・車検・保証・整備履歴・乗り換え見込みまでを同じ管理画面で確認できます。",
      "tags":["契約・入金","納車管理","点検・車検フォロー"],
      "note":"04と05は同じオーナーPC画面です。サイドメニューの「契約・書類」「納車・フォロー」「納車後管理」を順に確認します。",
      "url":"https://dpromstk2000-lab.github.io/dpro-used-car-line-liff/owner.html?demo=1",
      "cta":"オーナーPCを開く",
      "officialUrl":"https://dpromstk2000-lab.github.io/dpro-line-systems-site/lp-car.html"
    }
  ],
  "journey": [
    {"step":"01","text":"買取・下取り／写真査定"},
    {"step":"02","text":"販売在庫・試乗相談"},
    {"step":"03","text":"査定→商品化・商談"},
    {"step":"04","text":"契約・入金・納車"},
    {"step":"05","text":"点検・車検・乗り換え","sameScreen":true}
  ]
};

document.documentElement.style.setProperty("--flow-cols", String(Math.min(CONFIG.journey.length, 7)));
document.title = CONFIG.pageTitle;
document.getElementById("heroTitle").innerHTML = `${CONFIG.systemName}<br>公開操作デモ・画面一覧`;
document.getElementById("heroCopy").textContent = CONFIG.heroCopy;
document.getElementById("officialLink").href = CONFIG.officialUrl;
document.getElementById("primaryDemoLink").href = CONFIG.primaryDemoUrl;
document.getElementById("notice").textContent = CONFIG.notice;
document.getElementById("screenIntro").textContent = CONFIG.screenIntro;
document.getElementById("journeyIntro").textContent = CONFIG.journeyIntro;
document.getElementById("footer").textContent = `${CONFIG.systemName}｜公開操作デモ`;

document.getElementById("quickInfo").innerHTML = CONFIG.quickInfo.map(x =>
  `<div><small>${x.label}</small><strong>${x.text}</strong></div>`
).join("");

document.getElementById("screenGrid").innerHTML = CONFIG.screens.map(x => `
  <article class="card">
    <div class="card-number">${x.step}</div>
    <h3>${x.title}</h3>
    <p>${x.description}</p>
    <div class="pills">${x.tags.map(t => `<span>${t}</span>`).join("")}</div>
    <div class="card-note">${x.note}</div>
    <div class="card-actions">
      <a class="open" href="${x.url}">${x.cta}</a>
      <a class="official" href="${x.officialUrl}">説明</a>
    </div>
  </article>
`).join("");

document.getElementById("flowGrid").innerHTML = CONFIG.journey.map(x => `
  <div class="flow-step${x.sameScreen ? " same" : ""}">
    <b>${x.step}${x.sameScreen ? " / 同じ画面" : ""}</b>
    <strong>${x.text}</strong>
  </div>
`).join("");

/* R4: state machine is NOT duplicated. All actions call the R3 API. */
(() => {
  const guideGrid = document.getElementById("guideGrid");
  const toolbar = document.getElementById("guideToolbar");
  const statusNode = document.getElementById("guideStatus");
  let bound = false;

  const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));

  function syncStatus() {
    const api = window.DPRO_CAR_TUTORIAL;
    if (!api) return;
    const state = api.getState();
    const resume = toolbar.querySelector('[data-guide-action="resume"]');
    resume.hidden = !(state.status === "paused" || state.status === "active");
    const stateLabel={idle:"未開始",active:"進行中",paused:"一時停止",completed:"完了",skipped:"スキップ済み"}[state.status]||"確認中"; statusNode.textContent = `状態：${stateLabel} / ${state.step} / 10`;
  }

  function buildGuide() {
    const api = window.DPRO_CAR_TUTORIAL;
    if (!api || !Array.isArray(api.steps) || api.steps.length !== 10) return false;
    guideGrid.innerHTML = api.steps.map((step, index) => `
      <article class="guide-item"
        data-guide-step="${index + 1}"
        data-step-id="${esc(step.id)}"
        data-route="${esc(step.route)}"
        data-primary="${esc(step.primary)}"
        data-fallback="${esc(step.fallback || "")}">
        <div class="guide-id">手順 ${index + 1} / 10</div>
        <h3>${esc(step.title)}</h3>
        <p>${esc(step.copy)}</p>
        <div class="guide-meta">
        </div>
        <button class="guide-open" type="button" data-guide-go="${index + 1}">
          この手順から開始
        </button>
      </article>
    `).join("");

    if (!bound) {
      toolbar.addEventListener("click", event => {
        const button = event.target.closest("button[data-guide-action]");
        if (!button) return;
        const current = window.DPRO_CAR_TUTORIAL;
        if (!current) return;
        const action = button.dataset.guideAction;
        if (action === "start") current.start();
        if (action === "resume") current.resume();
        if (action === "replay") current.replay();
      });
      guideGrid.addEventListener("click", event => {
        const button = event.target.closest("button[data-guide-go]");
        if (!button) return;
        const current = window.DPRO_CAR_TUTORIAL;
        if (!current) return;
        current.goToStep(Number(button.dataset.guideGo));
      });
      window.addEventListener("dpro-car-tutorial-state", syncStatus);
      bound = true;
    }
    syncStatus();
    return true;
  }

  let tries = 0;
  const timer = setInterval(() => {
    tries += 1;
    if (buildGuide() || tries >= 120) {
      clearInterval(timer);
      if (tries >= 120 && !window.DPRO_CAR_TUTORIAL) {
        statusNode.textContent = "操作ガイドを読み込めませんでした。再読込してください。";
      }
    }
  }, 50);
})();
</script>

<div data-dpro-chat-b-owner-return hidden style="position:fixed;right:12px;bottom:12px;z-index:10000">
  <a href="owner.html" style="display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:8px 13px;border:1px solid rgba(0,0,0,.12);border-radius:999px;background:#fff;color:#173858;text-decoration:none;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.12)">オーナーPCへ戻る</a>
</div>
<script>
(()=>{'use strict';
  const fromOwner=new URLSearchParams(location.search).get('from')==='owner';
  const node=document.querySelector('[data-dpro-chat-b-owner-return]');
  if(node) node.hidden=!fromOwner;
})();
</script>
</body>
</html>
